<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATIC Oman · Raw Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of sections on desktop, top scroller on phones; work area of status cards and a detail sheet. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EAEFEA; --line:#D9E1DB; --ink:#16261F; --muted:#5C6E66; --faint:#8C9B94;
  --brand:#0F4C3A; --brand-ink:#FFFFFF; --gold:#B7832F; --gold-soft:#F4E7CF;
  --red:#B42318; --red-soft:#FDE8E6; --amber:#B54708; --amber-soft:#FEF0DC; --green:#067647; --green-soft:#DDF3E6; --idle:#7A8781; --idle-soft:#ECEFED;
  --shadow:0 1px 2px rgba(16,38,31,.06),0 4px 16px rgba(16,38,31,.05);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#15211D; --surface-2:#1C2B26; --line:#2A3B35; --ink:#E7EFEB; --muted:#9DB0A8; --faint:#6F827A;
  --brand:#4FB590; --brand-ink:#06261C; --gold:#E0B060; --gold-soft:#3A2E17;
  --red:#F97066; --red-soft:#3D1714; --amber:#F7A54A; --amber-soft:#3A2510; --green:#47CD89; --green-soft:#0F3323; --idle:#8A9892; --idle-soft:#1F2926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#15211D; --surface-2:#1C2B26; --line:#2A3B35; --ink:#E7EFEB; --muted:#9DB0A8; --faint:#6F827A;
  --brand:#4FB590; --brand-ink:#06261C; --gold:#E0B060; --gold-soft:#3A2E17;
  --red:#F97066; --red-soft:#3D1714; --amber:#F7A54A; --amber-soft:#3A2510; --green:#47CD89; --green-soft:#0F3323; --idle:#8A9892; --idle-soft:#1F2926;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--brand);color:var(--brand-ink);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
:root:not([data-theme="light"]) .rail{}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font:700 13px var(--f-display);color:#1b1306}
.logo b{font:700 17px var(--f-display);letter-spacing:.06em;display:block}
.logo small{opacity:.75;font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:8px;opacity:.82;display:flex;justify-content:space-between;align-items:center;font-weight:500}
nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.14)}
nav a .badge{font:600 11px var(--f-mono);background:var(--red);color:#fff;border-radius:10px;padding:1px 7px}
.rail .foot{margin-top:auto;font-size:12px;opacity:.75;padding:0 8px;line-height:1.45}
main{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.order{background:var(--red-soft);color:var(--red)} .chip.soon{background:var(--amber-soft);color:var(--amber)} .chip.ok{background:var(--green-soft);color:var(--green)} .chip.idle{background:var(--idle-soft);color:var(--idle)}
.chip.info{background:var(--gold-soft);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font:600 28px var(--f-display)}
.kpi.order .v{color:var(--red)} .kpi.soon .v{color:var(--amber)} .kpi.ok .v{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s}
.card:hover{transform:translateY(-1px);border-color:var(--brand)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--idle)}
.card.order::before{background:var(--red)} .card.soon::before{background:var(--amber)} .card.ok::before{background:var(--green)}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:16px}
.card .unit{color:var(--faint);font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.stat dt{color:var(--muted)} .stat dd{margin:0;text-align:right;font-family:var(--f-mono)}
.cover{height:8px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.cover i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.cover .lt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.covercap{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.spark{width:100%;height:44px;display:block}
.banner{border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.demo{background:var(--gold-soft);color:var(--ink);border:1px dashed var(--gold)}
.banner.note{background:var(--surface-2);color:var(--muted)}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.scen label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.scen output{font:600 15px var(--f-mono);color:var(--ink)}
input[type=range]{accent-color:var(--brand);width:100%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.neg td{color:var(--red)}
td input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);text-align:right;font-family:var(--f-mono)}
td input.wide{width:150px;text-align:left;font-family:var(--f-body)}
td input:disabled{opacity:.5}
th.off,td.off{background:var(--surface-2);color:var(--faint)}
th.ot{color:var(--gold)}
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.why li::marker{color:var(--gold)}
.chartbox{position:relative;height:300px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;box-shadow:var(--shadow)}
.ai{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.muted{color:var(--muted)} .small{font-size:13px}
.hint{font-size:13px;color:var(--muted);max-width:70ch}
.pill-input{display:flex;gap:8px;flex-wrap:wrap}
.pill-input input{flex:1 1 220px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.emails{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.emails span{background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 12px;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.emails button{border:0;background:transparent;color:var(--muted);padding:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.cal th,.cal td{padding:6px 4px;text-align:center;min-width:34px;font-size:12px}
.cal th:first-child,.cal td:first-child{text-align:left;min-width:64px;padding-left:12px}
.cal th.today{color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand)}
.cal td.past{opacity:.45}
.pc{display:inline-block;font:600 10px var(--f-mono);padding:2px 4px;border-radius:4px;margin:1px;color:#fff}
.pc-GM{background:#8A2B3A}.pc-RW{background:#C0577A}.pc-BW{background:#C7882E}.pc-LS{background:#7A8F1F}.pc-WV{background:#4F6B78}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--surface-2)} tr.sel td{background:var(--gold-soft)}
details summary{color:var(--brand);font-weight:500}
select,input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));gap:12px;z-index:5;overflow-x:auto}
  .rail .foot,.logo small{display:none}
  nav{flex-direction:row}
  nav a{white-space:nowrap;padding:7px 10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail,.scen{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,var(--brand) 0 38%,var(--bg) 38%)}
.login .box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:14px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.login input,.form input,.form select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.login .err{color:var(--red);font-size:14px;min-height:20px}
.userchip{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.15)}
.userchip b{font-size:14px}.userchip button{background:rgba(255,255,255,.12);color:inherit;border:0;border-radius:8px;padding:7px 10px;text-align:left}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
@media (max-width:900px){.form{grid-template-columns:1fr 1fr}.userchip{display:none}}
</style>

<div class="login" id="loginView" hidden><form class="box" id="loginForm">
  <div class="logo" style="padding:0"><div class="mark">AT</div><div><b style="color:var(--ink)">ATIC OMAN</b><small class="muted">Raw material outlook</small></div></div>

<script>
/* ATIC Oman raw material forecast engine. Shared by the web app and the weekly email job. */
(function (root) {
  var DAY = 86400000;
  function iso(d) { return new Date(d).toISOString().slice(0, 10); }
  function parse(s) { return new Date(s + 'T00:00:00Z').getTime(); }
  function addDays(s, n) { return iso(parse(s) + n * DAY); }
  function dow(s) { return new Date(parse(s)).getUTCDay(); } // 0 = Sunday
  function weekStart(s) { return addDays(s, -dow(s)); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / DAY); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function round(x, n) { var p = Math.pow(10, n || 0); return Math.round(x * p) / p; }

  /* Merge saved edits (db) over the baseline built from the Jan–Sep sheets. */
  function buildModel(base, saved) {
    saved = saved || {};
    var m = clone(base);
    var mat = (saved.materials && saved.materials.items) || {};
    m.materials.forEach(function (x) { if (mat[x.id]) Object.assign(x, mat[x.id]); });
    if (saved.recipes && saved.recipes.recipes) {
      var r = saved.recipes.recipes;
      Object.keys(r).forEach(function (p) {
        m.recipes[p] = m.recipes[p] || {};
        Object.keys(r[p]).forEach(function (s) { m.recipes[p][s] = r[p][s]; });
      });
    }
    var st = (saved.stock && saved.stock.items) || {};
    Object.keys(st).forEach(function (k) { m.stock[k] = st[k]; });
    m.plan = (saved.plan && saved.plan.days) ? saved.plan : { days: {}, weeks: [] };
    m.orders = (saved.orders || []).filter(function (o) { return o && o.status !== 'received' && o.status !== 'cancelled'; });
    m.settings = Object.assign({ basisWeeks: 8 }, saved.settings || {});
    return m;
  }

  /* Average batches per week for each product and section, from full weeks of history. */
  function avgWeekly(m) {
    var weeks = m.weeks, n = weeks.length;
    var full = [];
    for (var i = 0; i < n; i++) {
      var ws = weeks[i], we = addDays(ws, 6);
      if (ws >= m.history.from && we <= m.history.to) full.push(i);
    }
    var basis = m.settings.basisWeeks === 'all' ? full : full.slice(-Number(m.settings.basisWeeks || 8));
    var out = {};
    m.products.forEach(function (p) {
      var arr = m.weeklyBatches[p.id] || [];
      var sum = 0; basis.forEach(function (i) { sum += arr[i] || 0; });
      var avg = basis.length ? sum / basis.length : 0;
      var vals = basis.map(function (i) { return arr[i] || 0; });
      out[p.id] = { total: avg, weeks: basis.length, values: vals, sections: {} };
      if (p.id === 'GM') {
        out[p.id].sections['SEC-1'] = avg * m.gmSectionShare['SEC-1'];
        out[p.id].sections['SEC-2'] = avg * m.gmSectionShare['SEC-2'];
      } else out[p.id].sections[p.sections[0]] = avg;
    });
    return out;
  }

  /* Batches expected on one day: the factory plan when that week is planned, otherwise the average pace. */
  function batchesOn(m, day, avg, sc) {
    var wk = weekStart(day);
    var planned = (m.plan.from && day >= m.plan.from && day <= m.plan.to) || (m.plan.weeks || []).indexOf(wk) >= 0;
    var res = [];
    if (planned) {
      var d = m.plan.days[day] || {};
      Object.keys(d).forEach(function (k) {
        var b = Number(d[k]) || 0; if (!b) return;
        var parts = k.split('|'); res.push({ product: parts[0], section: parts[1], batches: b, source: 'plan' });
      });
    } else {
      var share = m.weekdayShare[dow(day)] || 0;
      Object.keys(avg).forEach(function (p) {
        Object.keys(avg[p].sections).forEach(function (s) {
          var b = avg[p].sections[s] * share * (sc.demandPct / 100);
          if (p === 'GM' && sc.extraGM) b += sc.extraGM * share * m.gmSectionShare[s];
          if (b > 0) res.push({ product: p, section: s, batches: b, source: 'average' });
        });
      });
    }
    return res;
  }

  function useOn(m, matId, items) {
    var total = 0, by = {};
    items.forEach(function (it) {
      var r = (m.recipes[it.product] || {})[it.section] || {};
      var q = Number(r[matId]) || 0;
      if (!q) return;
      var u = q * it.batches;
      total += u; by[it.product] = (by[it.product] || 0) + u;
    });
    return { total: total, by: by };
  }

  function forecast(base, saved, today, scenario) {
    var sc = Object.assign({ demandPct: 100, leadDays: null, extraGM: 0 }, scenario || {});
    var m = buildModel(base, saved);
    today = today || iso(Date.now());
    var avg = avgWeekly(m);
    var HORIZON = 26 * 7;
    var start = weekStart(today);
    var dayCache = {};
    function items(day) { return dayCache[day] || (dayCache[day] = batchesOn(m, day, avg, sc)); }
    var results = m.materials.map(function (mat) {
      var st = m.stock[mat.id] || { qty: 0, asOf: today, source: 'none' };
      var lead = { min: sc.leadDays || mat.leadMinDays, max: sc.leadDays || mat.leadMaxDays };
      // roll stock forward from count date to the start of this week
      var qty = Number(st.qty) || 0, gap = 0;
      var d = addDays(st.asOf, 1);
      var rollFrom = d;
      while (d < start) {
        var u0 = useOn(m, mat.id, items(d)).total; qty -= u0; gap += u0;
        m.orders.forEach(function (o) { if (o.material === mat.id && o.eta === d) qty += Number(o.qty) || 0; });
        d = addDays(d, 1);
      }
      var opening = qty;
      // weekly average use for this material at normal pace
      var weekly = 0, byProd = {};
      for (var k = 0; k < 7; k++) {
        var dd = addDays(addDays(start, 7 * 6), k); // a week outside any plan, for the normal pace
        var avgItems = [];
        Object.keys(avg).forEach(function (p) { Object.keys(avg[p].sections).forEach(function (s) {
          var b = avg[p].sections[s] * (m.weekdayShare[k] || 0) * (sc.demandPct / 100);

function vRecipes(fc) {
  var m = fc.model;
  var h = head('Recipes per batch', 'What one batch uses, by section. Changes apply to the whole forecast after you save.');
  h += accessNote(); h += lastSaved('recipes');
  m.products.forEach(function (p) {
    var used = m.materials.filter(function (x) { return ['SEC-1', 'SEC-2'].some(function (s) { return ((m.recipes[p.id] || {})[s] || {})[x.id]; }); });
    h += '<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="font-size:17px">' + PN[p.id] + '</h3><span class="small muted">' + (p.id === 'GM' ? 'Runs on both sections' : 'Usually Section 2') + '</span></div><div class="tablewrap"><table><thead><tr><th>Material</th><th>Unit</th><th class="n">Section 1</th><th class="n">Section 2</th></tr></thead><tbody>';
    var list = used.concat(m.materials.filter(function (x) { return used.indexOf(x) < 0; }).slice(0, 0));
    list.forEach(function (x) {
      h += '<tr><td>' + esc(x.name) + '</td><td class="muted">' + esc(x.recipeUnit) + (x.recipeFactor !== 1 ? ' <small>(stock in ' + x.unit + 's of ' + x.recipeFactor + ')</small>' : '') + '</td>' +
        ['SEC-1', 'SEC-2'].map(function (s) { var v = ((m.recipes[p.id] || {})[s] || {})[x.id] || 0; return '<td class="n"><input type="number" step="any" min="0" id="r_' + p.id + '_' + s + '_' + x.id + '" data-p="' + p.id + '" data-s="' + s + '" data-m="' + x.id + '" value="' + +(v * x.recipeFactor).toFixed(3) + '"></td>'; }).join('') + '</tr>';
    });
    h += '<tr><td colspan="4"><select id="add_' + p.id + '" data-p="' + p.id + '"><option value="">+ Add a material to this recipe</option>' + m.materials.filter(function (x) { return used.indexOf(x) < 0; }).map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('') + '</select></td></tr>';
    h += '</tbody></table></div></div>';
  });
  h += '<div class="row"><button class="btn primary" id="saveRec">Save recipes</button><span class="hint">Citric acid is entered in kg here and converted to 25 kg bags for stock.</span></div>';
  return h;
}
after.recipes = function (fc) {
  document.querySelectorAll('select[data-p]').forEach(function (sel) {
    sel.onchange = function () {
      if (!sel.value) return; var rec = collectRec(fc); rec[sel.dataset.p] = rec[sel.dataset.p] || {};
      ['SEC-1', 'SEC-2'].forEach(function (s) { rec[sel.dataset.p][s] = rec[sel.dataset.p][s] || {}; rec[sel.dataset.p][s][sel.value] = 0.0001; });
      S.saved.recipes = { recipes: rec }; render();
    };
  });
  $('#saveRec').onclick = function () { saveDoc('recipes', { recipes: collectRec(fc), updatedAt: new Date().toISOString() }); };
};
function collectRec(fc) {
  var rec = JSON.parse(JSON.stringify(fc.model.recipes));
  document.querySelectorAll('input[data-m][data-p]').forEach(function (i) {
    var x = fc.model.materials.filter(function (m) { return m.id === i.dataset.m; })[0];
    rec[i.dataset.p][i.dataset.s] = rec[i.dataset.p][i.dataset.s] || {};
    var v = Number(i.value) || 0; rec[i.dataset.p][i.dataset.s][i.dataset.m] = v / x.recipeFactor;
  });
  return rec;
}

/* ---------- stock & lead times ---------- */
function vStock(fc) {
  var m = fc.model;
  var h = head('Stock counts & lead times', 'Enter the latest count with its date. The forecast deducts expected use from that date to today.');
  h += accessNote(); h += lastSaved('stock');
  var lastThu = U.addDays(TODAY, -((new Date(TODAY + 'T00:00:00Z').getUTCDay() + 3) % 7)), lastSat = U.addDays(TODAY, -((new Date(TODAY + 'T00:00:00Z').getUTCDay() + 1) % 7));
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:6px">Weekly closing count</h3><p class="hint" style="margin:0 0 10px">At the end of the week, type the closing stock of each material below, set the date for all of them in one click, and save. That closing becomes the opening for Sunday. Between counts the app deducts the planned use day by day, so on a Wednesday it already shows the estimated stock for Wednesday.</p><div class="row"><span class="small muted">Set every count date to:</span><button class="btn" data-alld="' + lastThu + '">Thursday ' + U.nice(lastThu) + '</button><button class="btn" data-alld="' + lastSat + '">Saturday ' + U.nice(lastSat) + '</button><button class="btn" data-alld="' + TODAY + '">Today ' + U.nice(TODAY) + '</button></div></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>Material</th><th class="n">Counted qty</th><th>Unit</th><th>Count date</th><th>Odoo: order → receipt</th><th class="n">Lead min (days)</th><th class="n">Lead max (days)</th><th class="n">Safety (weeks)</th><th class="n">Order covers (weeks)</th></tr></thead><tbody>';
  m.materials.forEach(function (x) {
    var st = m.stock[x.id] || {};
    h += '<tr><td><b>' + esc(x.name) + '</b><br><span class="small muted">' + esc(st.source || '') + '</span></td>' +
      '<td class="n"><input type="number" step="any" id="q_' + x.id + '" data-q="' + x.id + '" value="' + (st.qty != null ? st.qty : '') + '"></td><td class="muted">' + esc(x.unit) + '</td>' +
      '<td><input class="wide" type="date" id="d_' + x.id + '" data-d="' + x.id + '" value="' + (st.asOf || '') + '"></td>' +
      '<td class="small">' + leadNote(x.id) + '</td>' +
      '<td class="n"><input type="number" id="lmin_' + x.id + '" data-lmin="' + x.id + '" value="' + x.leadMinDays + '"></td>' +
      '<td class="n"><input type="number" id="lmax_' + x.id + '" data-lmax="' + x.id + '" value="' + x.leadMaxDays + '"></td>' +
      '<td class="n"><input type="number" step="0.5" id="sw_' + x.id + '" data-sw="' + x.id + '" value="' + x.safetyWeeks + '"></td>' +
      '<td class="n"><input type="number" id="cw_' + x.id + '" data-cw="' + x.id + '" value="' + x.orderCoverWeeks + '"></td></tr>';
  });
  h += '</tbody></table></div><div class="row"><button class="btn primary" id="saveStock">Save stock &amp; lead times</button></div>';
  h += '<p class="hint">Lead times start at 60–90 days for every material, as agreed. The Odoo column shows what purchase history says (order date to first receipt, Oct 2025 – Oct 2026). Local items like sugar and salt usually arrive within a week, so you may want to shorten those. Odoo order dates are sometimes entered on arrival, so treat short times with care.</p>';
  var bw = (S.saved.settings && S.saved.settings.basisWeeks) || 8;
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:6px">Normal production pace</h3><p class="hint" style="margin:0 0 10px">Weeks without a factory plan use the average batches from the last weeks of history (Jan–Sep 2026, October not used).</p><div class="tabs">' +
    [[4, 'Last 4 weeks'], [8, 'Last 8 weeks'], [13, 'Last 13 weeks'], ['all', 'All of Jan–Sep']].map(function (o) { return '<button data-bw="' + o[0] + '" aria-pressed="' + (String(bw) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>' +
    '<p class="small muted" style="margin:10px 0 0">Current average: ' + Object.keys(fc.avg).map(function (p) { return PN[p] + ' ' + fmtN(fc.avg[p].total) + '/wk'; }).join(' · ') + '</p></div>';
  return h;
}
function leadNote(id) {
  var l = (BASE.odooLead || {})[id]; if (!l) return '<span class="muted">No purchase history</span>';
  var t = l.n ? 'median <b>' + l.median + ' d</b> · ' + l.min + '–' + l.max + ' d · ' + l.n + ' POs' : '';
  return t + (l.note ? (t ? '<br>' : '') + '<span class="muted">' + esc(l.note) + '</span>' : '');
}
after.stock = function (fc) {
  document.querySelectorAll('[data-alld]').forEach(function (b) { b.onclick = function () { document.querySelectorAll('input[data-d]').forEach(function (i) { i.value = b.dataset.alld; }); toast('Dates set. Enter the quantities, then save.'); }; });
  $('#saveStock').onclick = function () {
    var st = {}, mats = {};
    fc.model.materials.forEach(function (x) {
      var q = $('#q_' + x.id).value, d = $('#d_' + x.id).value, old = fc.model.stock[x.id] || {};
      if (q !== '' && d) st[x.id] = { qty: +q, asOf: d, source: (+q === old.qty && d === old.asOf) ? old.source : 'Entered in app ' + U.nice(TODAY) };
      mats[x.id] = { leadMinDays: +$('#lmin_' + x.id).value || 60, leadMaxDays: +$('#lmax_' + x.id).value || 90, safetyWeeks: +$('#sw_' + x.id).value || 0, orderCoverWeeks: +$('#cw_' + x.id).value || 8 };
    });
    saveDoc('stock', { items: st, updatedAt: new Date().toISOString() }).then(function () { return saveDoc('materials', { items: mats }); });
  };
  document.querySelectorAll('[data-bw]').forEach(function (b) { b.onclick = function () { var v = b.dataset.bw === 'all' ? 'all' : +b.dataset.bw; saveDoc('settings', Object.assign({}, S.saved.settings || {}, { basisWeeks: v })); S.saved.settings = Object.assign({}, S.saved.settings || {}, { basisWeeks: v }); render(); }; });
};

/* ---------- orders ---------- */
function vOrders(fc) {
  var items = (S.saved.orders && S.saved.orders.items) || [];
  var h = head('Open purchase orders', 'Orders already placed. Each one is added to stock on its expected arrival date.');
  h += accessNote(); h += lastSaved('orders');
  h += '<div class="panel"><div class="row"><select id="oMat">' + fc.model.materials.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + ' (' + x.unit + ')</option>'; }).join('') + '</select>' +
    '<input id="oQty" type="number" placeholder="Quantity" style="width:120px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)">' +
    '<input id="oEta" type="date" style="padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)">' +

    var x = fc.model.materials.filter(function (m) { return m.id === o.material; })[0] || { name: o.material, unit: '' };
    return '<tr><td>' + esc(x.name) + '</td><td class="n">' + fmtN(o.qty) + ' ' + esc(x.unit) + '</td><td>' + U.nice(o.eta) + '</td><td>' + esc(o.ref || '') + '</td><td>' + esc(o.status || 'open') + '</td><td><button class="btn" data-recv="' + i + '">Mark received</button> <button class="btn ghost" data-del="' + i + '">Remove</button></td></tr>';

after.orders = function () {
  var items = ((S.saved.orders && S.saved.orders.items) || []).slice();
  $('#oAdd').onclick = function () {
    var q = +$('#oQty').value, eta = $('#oEta').value; if (!q || !eta) { toast('Enter a quantity and an arrival date.'); return; }
    items.push({ material: $('#oMat').value, qty: q, eta: eta, ref: $('#oRef').value, status: 'open', added: TODAY }); saveDoc('orders', { items: items });
  };
  document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { items.splice(+b.dataset.del, 1); saveDoc('orders', { items: items }); }; });
  document.querySelectorAll('[data-recv]').forEach(function (b) { b.onclick = function () { items[+b.dataset.recv].status = 'received'; saveDoc('orders', { items: items }); }; });
};

/* ---------- alerts ---------- */
function vAlerts() {
  var a = S.saved.alerts || { emails: [], weekly: true, urgent: true };
  var last = S.saved.lastEmail;
  var h = head('Email alerts', 'Who gets the weekly outlook, and alerts when something turns red.');
  h += accessNote(); h += lastSaved('alerts');
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Recipients</h3><div class="pill-input"><input id="em" type="email" placeholder="name@aticoman.com or any email"><button class="btn primary" id="emAdd">Add</button></div>' +
    '<div class="emails">' + (a.emails || []).map(function (e, i) { return '<span>' + esc(e) + '<button data-rm="' + i + '" aria-label="Remove ' + esc(e) + '">×</button></span>'; }).join('') + (!(a.emails || []).length ? '<span class="muted small" style="background:transparent">No recipients yet. Emails go to Hasan until you add some.</span>' : '') + '</div></div>';
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Schedule</h3><ul class="why"><li><b>Weekly outlook</b>: every Sunday at 7:00, the full status table with the reason for each red or amber material.</li><li><b>Urgent alert</b>: checked every working morning at 7:30; sent only when a material newly turns red or will run out within 14 days.</li></ul>' +
    '<p class="small muted" style="margin:10px 0 0">' + (last && last.sentAt ? 'Last email sent ' + esc(last.sentAt.slice(0, 16).replace('T', ' ')) + ' (' + esc(last.kind || '') + ')' : 'No email sent yet.') + '</p></div>';
  return h;
}
after.alerts = function () {
  var a = JSON.parse(JSON.stringify(S.saved.alerts || { emails: [], weekly: true, urgent: true })); a.emails = a.emails || [];
  $('#emAdd').onclick = function () { var v = $('#em').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('That does not look like an email address.'); return; } a.emails.push(v); saveDoc('alerts', a); };
  document.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { a.emails.splice(+b.dataset.rm, 1); saveDoc('alerts', a); }; });
};

/* ---------- history ---------- */
function vHistory(fc) {
  var months = ['JAN', 'FEB', 'MAR', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEP'];
  var x = BASE.materials.filter(function (m) { return m.id === S.histMat; })[0];
  var h = head('History', 'Jan–Sep 2026 from the raw material sheet: opening, received, used and closing for each month.');
  h += '<div class="tabs">' + BASE.materials.map(function (m) { return '<button data-hm="' + m.id + '" aria-pressed="' + (m.id === S.histMat) + '">' + esc(m.name) + '</button>'; }).join('') + '</div>';
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Weekly use of ' + esc(x.name) + ' (' + x.unit + 's)</h3><div class="chartbox" style="height:220px"><canvas id="hc"></canvas></div></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>Month</th><th class="n">Opening</th><th class="n">Received</th><th class="n">Used</th><th class="n">Closing</th></tr></thead><tbody>' + months.map(function (mo) {
    var r = BASE.monthly[mo][x.id]; var cl = r.sheetClosing != null ? r.sheetClosing : r.closing;
    return '<tr><td>' + mo.charAt(0) + mo.slice(1).toLowerCase() + '</td><td class="n">' + fmtN(r.opening) + '</td><td class="n">' + fmtN(r.received) + '</td><td class="n">' + fmtN(r.used) + '</td><td class="n"><b>' + fmtN(cl) + '</b></td></tr>';
  }).join('') + '</tbody></table></div>';
  return h;
}
after.history = function () {
  document.querySelectorAll('[data-hm]').forEach(function (b) { b.onclick = function () { S.histMat = b.dataset.hm; render(); }; });
  var cs = getComputedStyle(document.documentElement), v = function (n) { return cs.getPropertyValue(n).trim(); };
  if (window.Chart) charts.push(new Chart($('#hc'), { type: 'bar', data: { labels: BASE.weeks.map(function (w) { return U.nice(w); }), datasets: [{ data: BASE.weeklyUsage[S.histMat], backgroundColor: v('--brand'), borderRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: v('--muted'), maxRotation: 0, autoSkip: true }, grid: { display: false } }, y: { ticks: { color: v('--muted') }, grid: { color: v('--line') } } } } }));
};

/* ---------- routing & data ---------- */
function go(v) { S.view = v; if (v !== 'material') { try { history.replaceState(null, '', '#' + v); } catch (e) {} } render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== S.view) { S.view = h; render(); } });
/* ---------- accounts (admin) ---------- */
S.users = [];
function vAccounts() {
  if (!S.profile || S.profile.role !== 'admin') return head('Accounts', 'Only the admin can manage accounts.');
  var h = head('Accounts', 'Create a username and password for each person. Only you can see this page.');
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:10px">New account</h3><form class="form" id="nuForm">' +
    '<label>Full name<input id="nuName" required placeholder="e.g. Yasser Mansour"></label>' +
    '<label>Username<input id="nuUser" required autocapitalize="none" placeholder="e.g. yasser"></label>' +
    '<label>Password<input id="nuPass" type="text" required minlength="6" placeholder="at least 6 characters"></label>' +
    '<label>Access<select id="nuRole"><option value="viewer">View only</option><option value="editor">Can edit</option><option value="admin">Admin (manages accounts)</option></select></label>' +
    '<button class="btn primary" style="padding:11px 16px">Create account</button></form><p class="hint" style="margin:10px 0 0">Send the person the website link with their username and password. View only: sees everything, changes nothing. Can edit: saves plans, stock counts, recipes and orders.</p></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>Name</th><th>Username</th><th>Access</th><th>Created</th><th>Actions</th></tr></thead><tbody>' + S.users.map(function (u) {
    var me = u.id === S.profile.id;
    return '<tr><td><b>' + esc(u.full_name || '–') + '</b>' + (me ? ' <span class="chip info">you</span>' : '') + '</td><td class="num">' + esc(u.username) + '</td><td><select data-role="' + u.id + '"' + (me ? ' disabled' : '') + '>' + [['viewer', 'View only'], ['editor', 'Can edit'], ['admin', 'Admin']].map(function (o) { return '<option value="' + o[0] + '"' + (u.role === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></td><td>' + U.nice(u.created_at.slice(0, 10)) + '</td><td class="row"><input id="pw_' + u.id + '" placeholder="new password" style="width:140px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)"><button class="btn" data-pw="' + u.id + '">Set password</button>' + (me ? '' : '<button class="btn ghost" data-delu="' + u.id + '" style="color:var(--red)">Delete</button>') + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  if (S.reportToken) h += '<p class="hint">Email job key: <span class="num">' + esc(S.reportToken) + '</span> (used only by the scheduled email; keep it private).</p>';
  return h;
}
async function loadUsers() { var r = await sb.from('profiles').select('*').order('created_at'); if (!r.error) S.users = r.data; }
after.accounts = function () {
  var f = $('#nuForm'); if (!f) return;
  f.onsubmit = async function (e) {
    e.preventDefault();
    var r = await sb.rpc('admin_create_user', { p_username: $('#nuUser').value, p_password: $('#nuPass').value, p_full_name: $('#nuName').value, p_role: $('#nuRole').value });
    if (r.error) { toast(r.error.message); return; }
    toast('Account created for ' + $('#nuName').value); await loadUsers(); render();
  };
  document.querySelectorAll('[data-role]').forEach(function (sel) { sel.onchange = async function () { var u = S.users.filter(function (x) { return x.id === sel.dataset.role; })[0]; var r = await sb.rpc('admin_update_user', { p_user: u.id, p_full_name: u.full_name, p_role: sel.value }); toast(r.error ? r.error.message : 'Access updated'); await loadUsers(); render(); }; });
  document.querySelectorAll('[data-pw]').forEach(function (b) { b.onclick = async function () { var v = $('#pw_' + b.dataset.pw).value; var r = await sb.rpc('admin_set_password', { p_user: b.dataset.pw, p_password: v }); toast(r.error ? r.error.message : 'Password changed'); }; });
  document.querySelectorAll('[data-delu]').forEach(function (b) { b.onclick = async function () {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Click again to delete'; return; }
    var r = await sb.rpc('admin_delete_user', { p_user: b.dataset.delu }); toast(r.error ? r.error.message : 'Account deleted'); await loadUsers(); render(); }; });
};

/* ---------- login ---------- */
function toEmail(u) { return String(u || '').trim().toLowerCase() + '@atic.local'; }
var setupMode = false;
async function showLogin() {
  $('#appView').hidden = true; $('#loginView').hidden = false;
  var r = await sb.rpc('needs_setup'); setupMode = !r.error && r.data === true;
  $('#lgTitle').textContent = setupMode ? 'Create the admin account' : 'Sign in';
  $('#lgSub').textContent = setupMode ? 'First time only. This account will create everyone else\'s.' : 'Use the username and password Hasan gave you.';
  $('#lgNameRow').hidden = !setupMode; $('#lgBtn').textContent = setupMode ? 'Create admin and sign in' : 'Sign in';
  $('#lgPass').setAttribute('autocomplete', setupMode ? 'new-password' : 'current-password');
}
$('#loginForm').onsubmit = async function (e) {
  e.preventDefault(); $('#lgErr').textContent = ''; $('#lgBtn').disabled = true;
  try {
    if (setupMode) { var s0 = await sb.rpc('setup_admin', { p_username: $('#lgUser').value, p_password: $('#lgPass').value, p_full_name: $('#lgName').value }); if (s0.error) throw s0.error; }
    var r = await sb.auth.signInWithPassword({ email: toEmail($('#lgUser').value), password: $('#lgPass').value });
    if (r.error) throw new Error('Wrong username or password.');
    await startApp(r.data.session);
  } catch (err) { $('#lgErr').textContent = err.message || String(err); }
  $('#lgBtn').disabled = false;
};
async function startApp(session) {
  var p = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (p.error || !p.data) { await sb.auth.signOut(); $('#lgErr').textContent = 'This account has no access. Ask Hasan.'; return showLogin(); }
  S.profile = p.data; S.canWrite = p.data.role === 'admin' || p.data.role === 'editor';
  $('#navAcc').hidden = p.data.role !== 'admin';
  $('#userChip').innerHTML = '<b>' + esc(p.data.full_name || p.data.username) + '</b><span style="opacity:.75;font-size:12px">' + ({ admin: 'Admin', editor: 'Can edit', viewer: 'View only' }[p.data.role]) + '</span><button id="signOut">Sign out</button>';
  $('#signOut').onclick = async function () { await sb.auth.signOut(); location.hash = ''; showLogin(); };
  $('#loginView').hidden = true; $('#appView').hidden = false;
  if (p.data.role === 'admin') { await loadUsers(); var t = await sb.rpc('admin_report_token'); S.reportToken = t.data; }
  var h = location.hash.slice(1); if (['overview', 'forecast', 'recipes', 'stock', 'orders', 'alerts', 'history', 'accounts'].indexOf(h) >= 0) S.view = h;
  await loadDocs();
  if (!S.channel) S.channel = sb.channel('docs').on('postgres_changes', { event: '*', schema: 'public', table: 'app_docs' }, function () { loadDocs(); }).subscribe();
}
(async function init() {
  if (!sb) { document.body.innerHTML = '<p style="padding:24px">Could not load. Check the internet connection and refresh.</p>'; return; }
  var s = await sb.auth.getSession();
  if (s.data && s.data.session) startApp(s.data.session); else showLogin();
})();
</script>
