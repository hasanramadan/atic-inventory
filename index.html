<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATIC Oman · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
.login .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.login .parts span{font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:3px 10px}
</style>
</head><body>
<div class="login" id="loginView" hidden><form class="box" id="loginForm">
  <div class="logo" style="padding:0"><div class="mark">AT</div><div><b style="color:var(--ink)">ATIC OMAN</b><small class="muted">Planning &amp; forecasting</small></div></div>
  <h2 id="lgTitle" style="font-size:22px">Sign in</h2><p class="small muted" id="lgSub" style="margin:0">Use the username and password Hasan gave you.</p>
  <label id="lgNameRow" hidden>Full name<input id="lgName" autocomplete="name"></label>
  <label>Username<input id="lgUser" autocomplete="username" required autocapitalize="none"></label>
  <label>Password<input id="lgPass" type="password" autocomplete="current-password" required></label>
  <div class="err" id="lgErr"></div>
  <button class="btn primary" style="padding:12px" id="lgBtn">Sign in</button>
  <div class="parts"><span>Line Planner</span><span>ATIC BETA 2.0</span><span>Raw Materials</span><span>Supply Planner</span><span>Forecast Results</span></div>
</form></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  var sb = ATIC.sb, setup = false, q = new URLSearchParams(location.search);
  function $(s) { return document.querySelector(s); }
  function toEmail(u) { return String(u || '').trim().toLowerCase() + '@atic.local'; }
  async function goIn(session) {
    var p = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (p.error || !p.data) { await sb.auth.signOut(); $('#lgErr').textContent = 'This account has no access. Ask Hasan.'; return show(); }
    var next = q.get('next') || '', key = next.split('.html')[0], page = ATIC.PAGES.filter(function (x) { return x.key === key || (key === 'index' && false); })[0];
    var dest = page && ATIC.allowed(p.data, page.key) ? next : ATIC.firstPage(p.data);
    if (!dest) { await sb.auth.signOut(); $('#lgErr').textContent = 'No pages are switched on for this account yet. Ask Hasan.'; return show(); }
    location.replace(dest);
  }
  async function show() {
    $('#loginView').hidden = false;
    var r = await sb.rpc('needs_setup'); setup = !r.error && r.data === true;
    $('#lgTitle').textContent = setup ? 'Create the admin account' : 'Sign in';
    $('#lgSub').textContent = setup ? 'First time only. This account will create everyone else\'s.' : 'Use the username and password Hasan gave you.';
    $('#lgNameRow').hidden = !setup; $('#lgBtn').textContent = setup ? 'Create admin and sign in' : 'Sign in';
    if (q.get('err') === 'noaccess') $('#lgErr').textContent = 'This account has no access. Ask Hasan.';
  }
  $('#loginForm').onsubmit = async function (e) {
    e.preventDefault(); $('#lgErr').textContent = ''; $('#lgBtn').disabled = true;
    try {
      if (setup) { var s0 = await sb.rpc('setup_admin', { p_username: $('#lgUser').value, p_password: $('#lgPass').value, p_full_name: $('#lgName').value }); if (s0.error) throw s0.error; }
      var r = await sb.auth.signInWithPassword({ email: toEmail($('#lgUser').value), password: $('#lgPass').value });
      if (r.error) throw new Error('Wrong username or password.');
      await goIn(r.data.session);
    } catch (err) { $('#lgErr').textContent = err.message || String(err); }
    $('#lgBtn').disabled = false;
  };
  (async function () {
    if (!sb) { document.body.innerHTML = '<p style="padding:24px">Could not load. Check the internet connection and refresh.</p>'; return; }
    var s = await sb.auth.getSession(); if (s.data && s.data.session) goIn(s.data.session); else show();
  })();
})();
</script>
</body></html>
