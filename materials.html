<link rel="stylesheet" href="css/app.css?v=202611021405">
<style>td input[data-q]{width:110px}.imp-g td.n input{width:96px}.rec td.bad{color:var(--red);font-weight:600}.rec td.warn{color:var(--amber);font-weight:600}.rec td.good{color:var(--green)}.dd{display:inline-flex;align-items:center;gap:6px}table.inv tr.grp td{background:var(--surface-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}table.inv tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--red)}table.inv tr.gone{opacity:.6}table.inv tr[hidden]{display:none}table.dc .bt{display:inline-flex;gap:4px;align-items:baseline;background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:12.5px;margin:1px 2px 1px 0}table.dc .bt small{color:var(--muted)}table.dc tr.off td{color:var(--muted);background:var(--surface-2)}table.dc tr[data-dc]{cursor:default}table.dc tfoot td{border-top:2px solid var(--line)}table.dc .sp{display:block;}.bysplit{display:block;margin-top:2px}.bysplit span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:400;font-family:var(--f-body)}.kpi .bysplit span{display:inline;margin-right:8px}table.dc .sp{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}.mono{font-family:var(--f-mono)}table.inv td input[data-invq]{width:110px}
.oftool{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ofwrap{position:relative}

.ofo .ck{width:16px;height:16px;border:1.5px solid var(--line);border-radius:5px;flex-shrink:0}.ofo[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}
.ofo[aria-pressed="true"]{font-weight:600}.offoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

<div class="app"><aside class="rail" id="rail"></aside>
  <main id="main"><div class="boot"><div><i></i>Loading Raw Materials…</div></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=202611021405"></script>
<script src="js/shell.js?v=202611021405"></script>
<script src="js/io.js?v=202611021405"></script>
<script src="js/excel.js?v=202611021405"></script>

<script src="js/inventory.js?v=202611021405"></script>
<script>
var BASE = null; /* company data loads from the database after sign-in */
var E = window.ATICEngine, U = E.util;
var TODAY = U.iso(Date.now());
var S = { saved: {}, db: null, canWrite: false, isOwner: false, view: 'overview', mat: null, scenario: null, scenOpen: false, planWeek: null, histMat: 'sugar', ai: {} };
var PN = { GM: 'Grenadine Molasses', BW: 'Blossom Water', RW: 'Rose Water', LS: 'Lemon Substitute', WV: 'White Vinegar' };
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DOCS = ['materials', 'recipes', 'stock', 'plan', 'orders', 'settings', 'alerts', 'lastEmail'];
var STATUS = { order: 'Order now', soon: 'Order soon', ok: 'Enough stock', idle: 'Not in use' };
var charts = [];

function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmtN(x) { if (x == null || isNaN(x)) return '–'; var a = Math.abs(x); return a >= 100 ? Math.round(x).toLocaleString('en-US') : (Math.round(x * 10) / 10).toLocaleString('en-US'); }
function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2600); }
function savedForEngine() {
  var s = S.saved;
  return { materials: s.materials, recipes: s.recipes, stock: s.stock, plan: s.plan, orders: (s.orders && s.orders.items) || [], settings: s.settings, actualDays: LP.days, actualSections: LP.secs };
}
function run() { return E.forecast(BASE, savedForEngine(), TODAY, S.scenario); }
function mat(id) { return run.cache.model.materials.filter(function (m) { return m.id === id; })[0]; }

var CFG = window.ATIC_CONFIG || {}, SB_URL = CFG.url, SB_KEY = CFG.key;
var sb = window.ATIC && ATIC.sb, A = null;
S.meta = {}; S.profile = null;
function lastSaved(name) {
  var m = S.meta[name]; if (!m || !m.saved_at) return '';
  var t = new Date(m.saved_at); var when = U.nice(U.iso(t)) + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  return '<div class="small muted">Last saved ' + when + ' by <b>' + esc(m.saved_by_name || 'someone') + '</b>. Everyone sees the same saved data.</div>';
}
async function saveDoc(name, data) {
  data = Object.assign({}, data); delete data.unsaved;
  if (!S.canWrite) { toast('You have view access. Ask your admin for edit access.'); return; }
  var r = await sb.from('app_docs').upsert({ name: name, data: data }).select().single();
  if (r.error) { toast('Could not save: ' + r.error.message); return; }
  S.saved[name] = r.data.data; S.meta[name] = r.data; toast('Saved'); render();
}
async function loadDocs() {
  var r = await sb.from('app_docs').select('*');
  if (r.error) { toast('Could not load data: ' + r.error.message); return; }
  S.saved = {}; r.data.forEach(function (d) { S.saved[d.name] = d.data; S.meta[d.name] = d; }); S.saved.actualDays = LP.days; S.saved.actualSections = LP.secs;
  if (S.saved.baseline) BASE = S.saved.baseline; else { $('#main').innerHTML = '<div class="empty">The database has no starting data yet.</div>'; return; }
  var y = window.scrollY; render(); window.scrollTo(0, y);
}
/* ---------- views ---------- */
function render() {
  if (!BASE) { $('#main').innerHTML = '<div class="empty">Loading data…</div>'; return; }
  charts.forEach(function (c) { try { c.destroy(); } catch (e) {} }); charts = [];
  var fc = run.cache = run();
  var red = fc.results.filter(function (r) { return r.status === 'order'; }).length;
  if (A) { A.badge('overview', red ? String(red) : ''); var ic = ((S.saved.inventory && S.saved.inventory.items) || []).filter(function (i) { return i.critical; }).length; A.badge('inventory', ic ? String(ic) : ''); A.setSub(S.view === 'material' ? 'overview' : S.view); }
  var m = $('#main');
  m.innerHTML = subbar() + ({ overview: vOverview, forecast: vForecast, recipes: vRecipes, inventory: vInventory, daily: vDaily, usage: vUsage, stock: vStock, orders: vOrders, alerts: vAlerts, history: vHistory, material: vMaterial }[S.view] || vOverview)(fc);
  (after[S.view] || function () {})(fc);
}
var after = {};

function head(title, sub, right) {
  return '<div class="top"><div><h1>' + title + '</h1><div class="sub">' + sub + '</div></div><div class="row">' + (right || '') + '</div></div>';
}
function weekLabel(ws) { return 'Week of ' + U.nice(ws) + ' – ' + U.nice(U.addDays(ws, 6)); }
function accessNote() {
  if (!S.canWrite) return '<div class="banner note">You have view access. Ask your admin for edit access to change plans or stock.</div>';
  return '';
}

function vOverview(fc) {
  var act = fc.results.filter(function (r) { return r.active; });
  var c = { order: 0, soon: 0, ok: 0 }; act.forEach(function (r) { c[r.status]++; });
  var first = act.filter(function (r) { return r.runOut; }).sort(function (a, b) { return a.runOut < b.runOut ? -1 : 1; })[0];
  var noOrders = !((S.saved.orders && S.saved.orders.items) || []).length;
  var h = head('Raw material outlook', weekLabel(fc.weekStart) + ' · today ' + U.nice(TODAY),
    '<button class="btn ' + (S.scenOpen ? 'primary' : '') + '" id="scenBtn">What-if demo</button>');
  h += accessNote();
  if (S.scenario) h += '<div class="banner demo"><b>Demo scenario on.</b> Numbers below show the what-if, not the real plan. Nothing is saved. <button class="btn" id="scenReset">Back to real numbers</button></div>';
  if (S.scenOpen) {
    var sc = S.scenario || { demandPct: 100, extraGM: 0, leadDays: 0 };
    h += '<div class="panel"><div class="scen">' +
      '<label>Production pace <output id="o1">' + sc.demandPct + '%</output><input type="range" id="s1" min="50" max="200" step="10" value="' + sc.demandPct + '"></label>' +
      '<label>Extra GM batches per week <output id="o2">+' + (sc.extraGM || 0) + '</output><input type="range" id="s2" min="0" max="80" step="5" value="' + (sc.extraGM || 0) + '"></label>' +
      '<label>Lead time for all materials <output id="o3">' + (sc.leadDays ? sc.leadDays + ' days' : 'as set') + '</output><input type="range" id="s3" min="0" max="150" step="15" value="' + (sc.leadDays || 0) + '"></label>' +
      '</div><p class="hint" style="margin:10px 0 0">Move a slider and every status, run-out date and order date updates. Use it to show what happens before Ramadan, or if a supplier is late.</p></div>';
  }
  h += '<div class="kpis">' +
    '<div class="kpi order"><span class="l">Order now</span><span class="v num">' + c.order + '</span><span class="small muted">materials</span></div>' +
    '<div class="kpi soon"><span class="l">Order within 3 weeks</span><span class="v num">' + c.soon + '</span><span class="small muted">materials</span></div>' +
    '<div class="kpi ok"><span class="l">Enough stock</span><span class="v num">' + c.ok + '</span><span class="small muted">materials</span></div>' +
    '<div class="kpi"><span class="l">First to run out</span><span class="v" style="font-size:20px">' + (first ? esc(first.name) : '–') + '</span><span class="small muted">' + (first ? 'around ' + U.nice(first.runOut) : '') + '</span></div></div>';
  if (noOrders) h += '<div class="banner note">No open purchase orders are entered yet, so red means "no order on record". Add orders that are already on the way on the <a href="#orders">Open orders</a> page.</div>';
  if (S.ai.brief) h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Weekly brief</h3><div class="ai" id="briefOut">' + esc(S.ai.brief) + '</div></div>';
  h += '<div class="legend"><span><i style="background:var(--red)"></i>Order now: delivery would land below the safety level</span><span><i style="background:var(--amber)"></i>Order within 21 days</span><span><i style="background:var(--green)"></i>Enough stock for now</span><span>▏ marker on the bar = lead time</span></div>';
  h += '<div class="grid">' + fc.results.map(card).join('') + '</div>';
  return h;
}
after.overview = function (fc) {
  $('#scenBtn').onclick = function () { S.scenOpen = !S.scenOpen; if (!S.scenOpen) S.scenario = null; render(); };
  var r = $('#scenReset'); if (r) r.onclick = function () { S.scenario = null; S.scenOpen = false; render(); };
  ['s1', 's2', 's3'].forEach(function (id) {
    var el = $('#' + id); if (!el) return;
    el.oninput = function () {
      S.scenario = { demandPct: +$('#s1').value, extraGM: +$('#s2').value, leadDays: +$('#s3').value || null };
      if (S.scenario.demandPct === 100 && !S.scenario.extraGM && !S.scenario.leadDays) S.scenario = null;
      var y = window.scrollY; render(); window.scrollTo(0, y); var f = $('#' + id); if (f) f.focus();
    };
  });
  document.querySelectorAll('.card[data-m]').forEach(function (el) { el.onclick = function () { S.mat = el.dataset.m; go('material'); }; });
};
function card(r) {
  var cov = r.weeksCover, ltw = r.lead.max / 7, max = Math.max(ltw * 1.4, 16);
  var pct = cov == null ? 0 : Math.min(100, cov / max * 100), ltp = Math.min(100, ltw / max * 100);
  var col = { order: 'var(--red)', soon: 'var(--amber)', ok: 'var(--green)', idle: 'var(--idle)' }[r.status];
  var orderTxt = !r.active ? '–' : r.status === 'order' ? 'Now' : r.orderBy ? U.nice(r.orderBy) : 'Not needed';
  return '<button class="card ' + r.status + '" data-m="' + r.id + '">' +
    '<div class="h"><div><h3>' + esc(r.name) + '</h3><span class="unit">' + esc(r.unit) + (r.note ? ' · ' + esc(r.note) : '') + '</span></div><span class="chip ' + r.status + '"><span class="dot"></span>' + STATUS[r.status] + '</span></div>' +
    (r.active ? spark(r) : '') +
    '<dl class="stat"><dt>Stock now</dt><dd>' + fmtN(Math.max(0, r.stockNow)) + '</dd><dt>Use per week</dt><dd>' + fmtN(r.weekly) + '</dd><dt>Runs out</dt><dd>' + (r.runOut ? U.nice(r.runOut) : '–') + '</dd><dt>Order by</dt><dd style="color:' + col + ';font-weight:600">' + orderTxt + '</dd></dl>' +
    (r.active ? '<div><div class="cover"><i style="width:' + pct + '%;background:' + col + '"></i><span class="lt" style="left:' + ltp + '%"></span></div><div class="covercap"><span>' + (cov == null ? '' : fmtN(cov) + ' weeks of cover') + '</span><span>lead ' + Math.round(ltw) + ' wk</span></div></div>' : '') +
    '</button>';
}
function spark(r) {
  var w = 240, h = 44, pts = r.weeks.slice(0, 20).map(function (x) { return Math.max(0, x.closing); });
  var all = pts.concat([r.safety, Math.max(0, r.stockNow)]); var mx = Math.max.apply(null, all) || 1;
  var xy = pts.map(function (v, i) { return [i / (pts.length - 1) * w, h - 3 - v / mx * (h - 8)]; });
  var d = xy.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var sy = (h - 3 - r.safety / mx * (h - 8)).toFixed(1);
  var col = { order: 'var(--red)', soon: 'var(--amber)', ok: 'var(--green)' }[r.status] || 'var(--idle)';
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="' + w + '" y1="' + sy + '" y2="' + sy + '" stroke="var(--faint)" stroke-dasharray="3 3" stroke-width="1"/><path d="' + d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="' + col + '" opacity=".12"/><path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2"/></svg>';
}

function vMaterial(fc) {
  var r = fc.results.filter(function (x) { return x.id === S.mat; })[0] || fc.results[0];
  var h = '<div><a href="#overview" class="small">← All materials</a></div>';
  h += head(esc(r.name), esc(r.unit) + (r.note ? ' · ' + esc(r.note) : '') + ' · lead time ' + Math.round(r.lead.min) + '–' + Math.round(r.lead.max) + ' days', '<span class="chip ' + r.status + '"><span class="dot"></span>' + STATUS[r.status] + '</span>');
  if (S.scenario) h += '<div class="banner demo"><b>Demo scenario on.</b> These numbers include the what-if settings.</div>';
  h += '<div class="kpis"><div class="kpi"><span class="l">Stock now</span><span class="v num">' + fmtN(Math.max(0, r.stockNow)) + '</span><span class="small muted">' + esc(r.unit) + 's, est.</span></div>' +
    '<div class="kpi"><span class="l">Use per week</span><span class="v num">' + fmtN(r.weekly) + '</span><span class="small muted">normal pace</span></div>' +
    '<div class="kpi ' + r.status + '"><span class="l">Order by</span><span class="v" style="font-size:22px">' + (r.status === 'order' ? 'Now' : r.orderBy ? U.nice(r.orderBy) : '–') + '</span><span class="small muted">' + (r.suggestedQty ? 'about ' + fmtN(r.suggestedQty) + ' ' + esc(r.unit) + 's' : '') + '</span></div>' +
    '<div class="kpi"><span class="l">Runs out</span><span class="v" style="font-size:22px">' + (r.runOut ? U.nice(r.runOut) : 'Not in 26 wk') + '</span><span class="small muted">' + (r.weeksCover != null ? fmtN(r.weeksCover) + ' weeks of cover' : '') + '</span></div></div>';
  h += '<div class="detail"><div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="font-size:16px">Projected balance, week by week</h3><div class="legend"><span><i style="background:var(--brand)"></i>Closing balance</span><span><i style="background:var(--gold)"></i>Use</span><span><i style="background:var(--red)"></i>Safety level</span></div></div><div class="chartbox"><canvas id="ch"></canvas></div></div>' +
    '<div class="panel"><h3 style="font-size:16px;margin-bottom:10px">Why</h3><ul class="why">' + r.why.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
    '</div></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>Week</th><th class="n">Opening</th><th class="n">Use</th><th class="n">Arriving</th><th class="n">Closing</th><th>Source</th></tr></thead><tbody>' +
    r.weeks.slice(0, 16).map(function (w) { return '<tr class="' + (w.closing < 0 ? 'neg' : '') + '"><td>' + U.nice(w.start) + ' – ' + U.nice(U.addDays(w.start, 6)) + '</td><td class="n">' + fmtN(w.opening) + '</td><td class="n">' + fmtN(w.use) + '</td><td class="n">' + (w.received ? fmtN(w.received) : '') + '</td><td class="n">' + fmtN(w.closing) + '</td><td>' + (w.fromPlan ? '<span class="chip info">Factory plan</span>' : '<span class="small muted">Average pace</span>') + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="hint">Negative closing means the plan cannot be produced without new stock. Weeks with a factory plan use the planned batches; other weeks use the recent average pace.</p>';
  return h;
}
after.material = function (fc) {
  var r = fc.results.filter(function (x) { return x.id === S.mat; })[0] || fc.results[0];
  var cs = getComputedStyle(document.documentElement), v = function (n) { return cs.getPropertyValue(n).trim(); };
  var wk = r.weeks.slice(0, 20);
  if (window.Chart) charts.push(new Chart($('#ch'), {
    data: { labels: wk.map(function (w) { return U.nice(w.start); }), datasets: [
      { type: 'line', label: 'Closing balance', data: wk.map(function (w) { return Math.round(w.closing); }), borderColor: v('--brand'), backgroundColor: v('--brand') + '22', fill: true, tension: .25, pointRadius: 2 },
      { type: 'line', label: 'Safety level', data: wk.map(function () { return Math.round(r.safety); }), borderColor: v('--red'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5 },
      { type: 'bar', label: 'Use', data: wk.map(function (w) { return Math.round(w.use); }), backgroundColor: v('--gold') + 'AA', borderRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: v('--muted'), maxRotation: 0, autoSkip: true }, grid: { display: false } }, y: { ticks: { color: v('--muted') }, grid: { color: v('--line') } } } }
  }));
};

/* ---------- forecast & production plan ---------- */
var LINES = { 'SEC-1': 'Line 1', 'SEC-2': 'Line 2' };
function planRuns() { return ((S.saved.plan && S.saved.plan.runs) || []).slice(); }
/* Sizes made per product. The recipe is the same for every size; the batches a line makes per day are not. */
var SIZES = { GM: ['300ml', '500ml', '750ml'], LS: ['1L'], WV: ['1L'], RW: ['300ml', '750ml'], BW: ['300ml', '750ml'] };
/* Batches per day for a product + size on a line, from the Line Planner actuals (median of the days it ran).
   Falls back to the same size on the other line, then the product on that line, then the Jan–Sep history. */
function estBatches(p, size, sec) {

        });

      var byPL = {}; keys.forEach(function (k) { var p = k.split('|'); (byPL[p[0] + '|' + p[1]] = byPL[p[0] + '|' + p[1]] || []).push(p[2]); });
      var runs = [];

        function close(end) { runs.push({ product: p[0], from: start, to: end, lines: p[1], sat: sat }); }
        ds.forEach(function (d, i) {

  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Recipients</h3><div class="pill-input"><input id="em" type="email" placeholder="name@aticoman.com or any email"><button class="btn primary" id="emAdd">Add</button></div>' +
    '<div class="emails">' + (a.emails || []).map(function (e, i) { return '<span>' + esc(e) + '<button data-rm="' + i + '" aria-label="Remove ' + esc(e) + '">×</button></span>'; }).join('') + (!(a.emails || []).length ? '<span class="muted small" style="background:transparent">No recipients yet. No emails are sent until you add a recipient.</span>' : '') + '</div></div>';
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Schedule</h3><ul class="why"><li><b>Weekly outlook</b>: every Sunday at 7:00, the full status table with the reason for each red or amber material.</li><li><b>Urgent alert</b>: checked every working morning at 7:30; sent only when a material newly turns red or will run out within 14 days.</li></ul>' +
    '<p class="small muted" style="margin:10px 0 0">' + (last && last.sentAt ? 'Last email sent ' + esc(last.sentAt.slice(0, 16).replace('T', ' ')) + ' (' + esc(last.kind || '') + ')' : 'No email sent yet.') + '</p></div>';
  return h;
}
after.alerts = function () {
  var a = JSON.parse(JSON.stringify(S.saved.alerts || { emails: [], weekly: true, urgent: true })); a.emails = a.emails || [];
  $('#emAdd').onclick = function () { var v = $('#em').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('That does not look like an email address.'); return; } a.emails.push(v); saveDoc('alerts', a); };
  document.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { a.emails.splice(+b.dataset.rm, 1); saveDoc('alerts', a); }; });
};

/* ---------- history ---------- */
function vHistory(fc) {
  var months = ['JAN', 'FEB', 'MAR', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEP'];
  var x = BASE.materials.filter(function (m) { return m.id === S.histMat; })[0];
  var h = head('History', 'Jan–Sep 2026 from the raw material sheet: opening, received, used and closing for each month.');
  h += '<div class="tabs">' + BASE.materials.map(function (m) { return '<button data-hm="' + m.id + '" aria-pressed="' + (m.id === S.histMat) + '">' + esc(m.name) + '</button>'; }).join('') + '</div>';
  h += '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Weekly use of ' + esc(x.name) + ' (' + x.unit + 's)</h3><div class="chartbox" style="height:220px"><canvas id="hc"></canvas></div></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>Month</th><th class="n">Opening</th><th class="n">Received</th><th class="n">Used</th><th class="n">Closing</th></tr></thead><tbody>' + months.map(function (mo) {
    var r = BASE.monthly[mo][x.id]; var cl = r.sheetClosing != null ? r.sheetClosing : r.closing;
    return '<tr><td>' + mo.charAt(0) + mo.slice(1).toLowerCase() + '</td><td class="n">' + fmtN(r.opening) + '</td><td class="n">' + fmtN(r.received) + '</td><td class="n">' + fmtN(r.used) + '</td><td class="n"><b>' + fmtN(cl) + '</b></td></tr>';
  }).join('') + '</tbody></table></div>';
  return h;
}
after.history = function () {
  document.querySelectorAll('[data-hm]').forEach(function (b) { b.onclick = function () { S.histMat = b.dataset.hm; render(); }; });
  var cs = getComputedStyle(document.documentElement), v = function (n) { return cs.getPropertyValue(n).trim(); };
  if (window.Chart) charts.push(new Chart($('#hc'), { type: 'bar', data: { labels: BASE.weeks.map(function (w) { return U.nice(w); }), datasets: [{ data: BASE.weeklyUsage[S.histMat], backgroundColor: v('--brand'), borderRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: v('--muted'), maxRotation: 0, autoSkip: true }, grid: { display: false } }, y: { ticks: { color: v('--muted') }, grid: { color: v('--line') } } } } }));
};

/* ---------- routing & data ---------- */
function go(v) { S.view = v; if (v !== 'material') { try { history.replaceState(null, '', '#' + v); } catch (e) {} } render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== S.view) { S.view = h; render(); } });
</script>
