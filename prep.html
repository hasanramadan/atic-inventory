<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<style>
.pp{max-width:1220px;margin:0 auto;padding:22px 26px 60px}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;color:#eef5f1;background:radial-gradient(900px 500px at 80% -20%,#2a7a5b 0%,#0f4c3a 45%,#082a20 100%);box-shadow:0 30px 60px -20px rgba(8,42,32,.55);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:330px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px);mask-image:linear-gradient(180deg,transparent,#000 60%);pointer-events:none}
.hl{padding:30px 32px;position:relative;z-index:1;display:flex;flex-direction:column;gap:16px}
.hl .kick{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hl h1{font:600 clamp(26px,3vw,38px)/1.1 var(--f-display);margin:0;color:#fff}
.datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebar input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;font:500 15px var(--f-body);color-scheme:dark}
.datebar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:500}
.datebar button:hover{background:rgba(255,255,255,.18)}
.ticket{perspective:700px;align-self:flex-start}
.ticket .t{display:flex;align-items:stretch;transform:rotateX(14deg) rotateY(-16deg);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:14px;background:linear-gradient(135deg,#f6dc9c,#d9a541 55%,#b7832f);color:#2a1a04;box-shadow:0 18px 30px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.ticket:hover .t{transform:rotateX(0) rotateY(0) scale(1.03)}
.ticket .a{padding:12px 16px;border-right:2px dashed rgba(42,26,4,.35);font:600 11px var(--f-mono);letter-spacing:.14em;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.ticket .b{padding:10px 20px}
.ticket .b small{display:block;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.ticket .b b{font:700 40px/1 var(--f-mono);letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:auto}
.stats div{font-size:13px;opacity:.8}.stats b{display:block;font:600 26px var(--f-display);color:#fff;opacity:1}
/* 3D tanks */
.scene{position:relative;z-index:1;perspective:1100px;display:grid;place-items:center;padding:20px}
.floor{position:relative;width:100%;max-width:520px;height:290px;transform-style:preserve-3d;transform:rotateX(var(--rx,10deg)) rotateY(var(--ry,-14deg));transition:transform .25s ease-out}

.tanks{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:flex-end;transform-style:preserve-3d}
.tk{position:relative;width:150px;height:240px;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center}
.tk svg{width:150px;height:220px;overflow:visible;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.tk .lbl{transform:translateZ(40px);margin-top:4px;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85;text-align:center}
.tk .lbl b{display:block;font:600 15px var(--f-display);letter-spacing:0;text-transform:none;color:#fff}
.liq{transition:y .7s cubic-bezier(.2,.7,.2,1),height .7s cubic-bezier(.2,.7,.2,1)}
.wv{animation:wv 3.2s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-14px)}}
.mixr{transform-origin:75px 70px;animation:spn 2.6s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.bb{animation:bb 2.4s ease-in infinite;opacity:0}@keyframes bb{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-60px);opacity:0}}
/* ---------- sections ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}

.sec h2{font:600 18px var(--f-display);margin:0;display:flex;align-items:center;gap:10px}
.sec h2 .n{font:600 12px var(--f-mono);background:var(--surface-2);border-radius:99px;padding:3px 10px;color:var(--muted)}
.sec .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.prow{display:grid;grid-template-columns:18px 1fr auto auto auto 34px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.2)}
.prow select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-body)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}

.x{border:0;background:transparent;color:var(--faint);font-size:20px;cursor:pointer;border-radius:8px;height:34px}.x:hover{color:var(--red);background:var(--red-soft)}
.add{margin-top:8px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-weight:500;cursor:pointer}.add:hover{border-color:var(--brand);color:var(--brand)}
.src{font-size:12.5px;color:var(--muted)}

.mc .nm{font:600 15px var(--f-display);margin:0 0 2px}

.mc .q small{font:500 14px var(--f-body);color:var(--muted);margin-left:4px}
.mc .alt{font-size:13px;color:var(--muted)}
.mc .by{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.mc .by i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:12px;overflow:hidden}.bar b{display:block;height:100%;border-radius:99px;background:var(--green)}
.mc.short .bar b{background:var(--red)}.mc.tight .bar b{background:var(--amber)}
.mc .st{font-size:12.5px;margin-top:6px;color:var(--muted)}.mc.short .st{color:var(--red);font-weight:600}
.empty3{text-align:center;padding:46px 20px;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty3 .ic{font-size:40px}
.note2{font-size:13px;color:var(--muted);margin-top:14px}
/* ---------- print sheet ---------- */
#sheet{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000}
  .rail,.pp,.toast{display:none!important}
  .app{display:block}
  #sheet{display:block;font:12pt/1.4 var(--f-body);color:#000}
  #sheet h1{font:700 20pt var(--f-display);margin:0}
  #sheet .meta{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  #sheet .lotp{font:700 22pt var(--f-mono);border:2px solid #000;padding:4px 12px;border-radius:6px}
  #sheet table{width:100%;border-collapse:collapse;margin:6px 0 16px}
  #sheet th,#sheet td{border:1px solid #000;padding:6px 8px;text-align:left}
  #sheet td.n,#sheet th.n{text-align:right}
  #sheet h2{font:600 13pt var(--f-display);margin:12px 0 4px}
  #sheet .sign{display:flex;gap:30px;margin-top:34px}#sheet .sign div{flex:1;border-top:1.5px solid #000;padding-top:6px;font-size:11pt}
  #sheet table.big th{font-size:11pt;background:#eee}#sheet table.big td{font-size:14pt;padding:12px 10px;height:16mm;vertical-align:middle}#sheet table.big td b{font-size:16pt}#sheet .sm{font-size:9.5pt;color:#333;font-weight:400}
}
@media (max-width:900px){.hero{grid-template-columns:1fr}.scene{padding:0 10px 18px}.floor{height:262px}.grid2{grid-template-columns:1fr}.pp{padding:16px 14px 50px}}

<script>
(async function () {
  var A = await ATIC.boot({ page: 'prep', area: 'preparation' }); if (!A) return;
  var E = window.ATICEngine, U = E.util, TODAY = U.iso(Date.now());
  var PN = { GM: 'Grenadine Molasses', BW: 'Blossom Water', RW: 'Rose Water', LS: 'Lemon Substitute', WV: 'White Vinegar' };
  var COL = { GM: ['#c2385a', '#5e0f24'], LS: ['#f2e27a', '#c9a92a'], WV: ['#e3f3f1', '#9cc9c3'], RW: ['#f4b9c9', '#c76a86'], BW: ['#f8eccd', '#d6bd7f'] };
  var SEC = { 'SEC-1': 'Section 1', 'SEC-2': 'Section 2' };
  var SIZES = { GM: ['300ml', '500ml', '750ml'], LS: ['1L'], WV: ['1L'], RW: ['300ml', '750ml'], BW: ['300ml', '750ml'] };
  var $ = function (s, r) { return (r || document).querySelector(s); }, esc = A.esc;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2600); }
  function fq(x) { if (!x) return '0'; return (Math.round(x * 1000) / 1000).toLocaleString('en-US', { maximumFractionDigits: 3 }); } /* no rounding */
  function pl(u, q) { u = String(u || ''); return /^(kg|g|l|L|ml|mL|ton|t)$/.test(u) || Math.abs(q - 1) < 1e-9 || /s$/.test(u) ? u : /(x|ch|sh)$/.test(u) ? u + 'es' : u + 's'; }
  function nice(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }

  /* ---------- data: recipes, materials, stock; Line Planner plans & actuals ---------- */
  var docs, acts = [], plans = [], BASE, model, stockNow = {};
  try {
    var r = await Promise.all([A.docs.loadAll(), A.planner.list('actuals'), A.planner.list('plans')]);
    docs = r[0].data; acts = r[1].map(function (x) { return x.data; }); plans = r[2].map(function (x) { return x.data; });
  } catch (e) { $('#main').innerHTML = '<div class="empty">Could not load data: ' + esc(e.message) + '</div>'; return; }
  BASE = docs.baseline; if (!BASE) { $('#main').innerHTML = '<div class="empty">No recipes in the database yet.</div>'; return; }
  var days = {}, secs = {};
  acts.forEach(function (a) {
    if (!a || !a.date || !a.sec) return; var sc = a.sec === 'S1' ? 'SEC-1' : 'SEC-2'; (secs[a.date] = secs[a.date] || {})[sc] = 1;
    ((a.runs && a.runs.length) ? a.runs : [{ product: a.product, batches: a.batches }]).forEach(function (q) { var b = Number(q.batches) || 0; if (b > 0 && q.product) { var k = q.product + '|' + sc; (days[a.date] = days[a.date] || {})[k] = (days[a.date][k] || 0) + b; } });
  });
  try {
    var fc = E.forecast(BASE, { materials: docs.materials, recipes: docs.recipes, stock: docs.stock, plan: docs.plan, orders: (docs.orders && docs.orders.items) || [], settings: docs.settings, actualDays: days, actualSections: secs }, TODAY);
    model = fc.model; fc.results.forEach(function (x) { stockNow[x.id] = x.stockNow; });
  } catch (e) { model = E.buildModel ? E.buildModel(BASE, { materials: docs.materials, recipes: docs.recipes }) : BASE; }
  var MATS = {}; model.materials.forEach(function (x) { MATS[x.id] = x; });
  /* packs as they sit in the store, from the Inventory ("25 Kg/bag", "265 kg/drum") */
  var UW = { bags: 'bag', cans: 'can', buckets: 'bucket', drums: 'drum', boxes: 'box', tanks: 'tank', kgs: 'kg', kilo: 'kg', ltr: 'l', litre: 'l', liter: 'l', litres: 'l', liters: 'l' };
  function uw(t) { t = String(t || '').toLowerCase().replace(/[^a-z]/g, ''); return UW[t] || t.replace(/s$/, ''); }
  var PACKS = {};
  ((docs.inventory && docs.inventory.items) || []).forEach(function (i) {
    if (!i || !i.mat) return; var m = String(i.packTxt || '').toLowerCase().replace(/,/g, '.').match(/([\d.]+)\s*(kg|kgs|g|l|ltr|litre|liter)\s*\/?\s*([a-z]+)?/);
    if (!m) return; var pk = { size: +m[1] * (m[2] === 'g' ? 0.001 : 1), of: uw(m[2]) === 'g' ? 'kg' : uw(m[2]), per: m[3] ? uw(m[3]) : 'pack' };
    var L = PACKS[i.mat] = PACKS[i.mat] || []; if (!L.some(function (x) { return x.size === pk.size && x.per === pk.per; })) L.push(pk);
  });
  /* the amount in kg when it can be known, and in the store's packs */
  function inKg(x, app) {
    var q = app * (x.recipeFactor || 1), ru = uw(x.recipeUnit || x.unit), P = PACKS[x.id] || [];
    if (ru === 'kg') return q;
    var p = P.filter(function (k) { return k.of === 'kg' && k.per === ru; })[0]; if (p) return q * p.size;
    if (uw(x.unit) === 'kg') return app;
    return null;
  }
  /* whole packs + loose kg, the way the store hands it out: "12 bags of 25 kg + 9.5 kg" */
  function splitPacks(x, kg) {
    if (kg == null) return null; var P = (PACKS[x.id] || []).filter(function (k) { return k.of === 'kg' && k.size > 0; })[0]; if (!P) return null;
    var whole = Math.floor(kg / P.size + 1e-9), loose = Math.round((kg - whole * P.size) * 1000) / 1000;
    return { whole: whole, per: P.per, size: P.size, loose: loose, txt: (whole ? whole + ' ' + pl(P.per, whole) + ' of ' + fq(P.size) + ' kg' : '') + (whole && loose ? ' + ' : '') + (loose || !whole ? fq(loose) + ' kg' + (!whole ? ' (less than one ' + P.per + ')' : '') : '') };
  }
  function packsTxt(x, kg) { if (kg == null) return ''; return (PACKS[x.id] || []).filter(function (k) { return k.of === 'kg' && k.size > 0; }).map(function (k) { var n = kg / k.size; return fq(n) + ' ' + pl(k.per, n) + ' of ' + fq(k.size) + ' kg'; }).join(' or '); }
  function recList(p) { var V = (model.variants || {})[p] || {}; return [{ id: '', name: (docs.recipes && docs.recipes.names && docs.recipes.names[p]) || 'Standard' }].concat(Object.keys(V).map(function (k) { return { id: k, name: V[k].name || k }; })); }
  function recOf(p, v, sec) { var V = v && model.variants && model.variants[p] && model.variants[p][v]; return (V ? V[sec] : (model.recipes[p] || {})[sec]) || {}; }
  var PRODS = model.products.map(function (p) { return p.id; }).filter(function (p) { return PN[p]; });

  /* ---------- state: one list of {p, b} per section, kept per day on this device ---------- */
  var S = { date: TODAY, rows: { 'SEC-1': [], 'SEC-2': [] }, src: '' };
  function key() { return 'aticPrep:' + S.date; }
  function store() { try { localStorage.setItem(key(), JSON.stringify(S.rows)); } catch (e) {} }
  function fromLP(date) {
    var out = { 'SEC-1': [], 'SEC-2': [] }, src = '';
    var put = function (sec, runs) { runs.forEach(function (q) { var b = Math.round((Number(q.batches) || 0) * 1000) / 1000; if (q.product && b > 0 && PN[q.product]) { var e = out[sec].filter(function (x) { return x.p === q.product && (x.z || '') === (q.size || ''); })[0]; if (e) e.b += b; else out[sec].push({ p: q.product, z: q.size || '', b: b }); } }); };
    ['S1', 'S2'].forEach(function (s) {
      var sec = s === 'S1' ? 'SEC-1' : 'SEC-2';
      var a = acts.filter(function (x) { return x.date === date && x.sec === s; })[0], pl = plans.filter(function (x) { return x.date === date && x.sec === s; })[0];
      if (a) { put(sec, (a.runs && a.runs.length) ? a.runs : [{ product: a.product, size: a.size, batches: a.batches }]); src = src || 'actual'; }
      else if (pl && pl.inputs) { put(sec, pl.inputs.runs || [{ product: pl.inputs.product, size: pl.inputs.size, batches: pl.inputs.batches }]); src = src || 'plan'; }
    });
    if (!out['SEC-1'].length && !out['SEC-2'].length) {
      var ld = docs.plan && docs.plan.lineDays && docs.plan.lineDays[date];
      if (ld) ['SEC-1', 'SEC-2'].forEach(function (sc) { (ld[sc] || []).forEach(function (x) { if (PN[x.product] && Number(x.batches) > 0) out[sc].push({ p: x.product, z: x.size || '', v: x.recipe || '', b: Math.round(Number(x.batches) * 1000) / 1000 }); }); });
      if (out['SEC-1'].length || out['SEC-2'].length) src = 'factory';
      var fp = !src && docs.plan && docs.plan.days && docs.plan.days[date];
      if (fp) { Object.keys(fp).forEach(function (k) { var q = k.split('|'); if (q[1] && out[q[1]] && Math.round(fp[k]) > 0 && PN[q[0]]) out[q[1]].push({ p: q[0], b: Math.round(fp[k]) }); }); if (out['SEC-1'].length || out['SEC-2'].length) src = 'factory'; }
    }
    return { rows: out, src: src };
  }
  function fixSizes() { Object.keys(S.rows).forEach(function (sc) { S.rows[sc].forEach(function (r) { var L = SIZES[r.p] || []; if (L.length && L.indexOf(r.z) < 0) r.z = L[L.length - 1]; }); }); }
  function load() {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(key()) || 'null'); } catch (e) {}
    if (saved) { S.rows = saved; S.src = 'mine'; return; }
    var f = fromLP(S.date); S.rows = f.rows; S.src = f.src;
  }
  var _load = load; load = function () { _load(); fixSizes(); };

  /* ---------- the maths: batches × recipe ---------- */
  function need(only) {
    var out = {};
    Object.keys(S.rows).filter(function (sec) { return !only || sec === only; }).forEach(function (sec) {
      S.rows[sec].forEach(function (row) {
        if (!row.p || !(row.b > 0)) return;
        var rec = recOf(row.p, row.v, sec); row.z = row.z || '';
        Object.keys(rec).forEach(function (mid) {
          var per = Number(rec[mid]) || 0; if (!per || !MATS[mid]) return;
          var o = out[mid] = out[mid] || { id: mid, app: 0, by: [] };
          o.app += per * row.b; o.by.push({ p: row.p, z: row.z || '', v: row.v || '', sec: sec, b: row.b, app: per * row.b });
        });
      });
    });
    return Object.keys(out).map(function (k) { return out[k]; }).sort(function (a, b) { return b.app * (MATS[b.id].recipeFactor || 1) - a.app * (MATS[a.id].recipeFactor || 1); });
  }
  function unitTxt(x, app) { var f = x.recipeFactor || 1; return { main: app * f, mu: x.recipeUnit || x.unit, alt: f !== 1 ? app : null, au: x.unit }; }
  function totals() { var b = 0, p = {}; Object.keys(S.rows).forEach(function (s) { S.rows[s].forEach(function (r) { if (r.p && r.b > 0) { b += r.b; p[r.p] = 1; } }); }); return { b: b, p: Object.keys(p).length }; }

  /* ---------- views ---------- */
  function tankSvg(sec) {
    var rows = S.rows[sec].filter(function (r) { return r.p && r.b > 0; }), tot = rows.reduce(function (s, r) { return s + r.b; }, 0);
    var cap = Math.max(20, tot), H = 150, top = 40, y = top + H, layers = '', id = sec.replace('-', '');
    rows.forEach(function (r, i) {
      var h = H * r.b / cap, c = COL[r.p] || ['#8fd3b6', '#2c7a5b']; y -= h;
      layers += '<defs><linearGradient id="g' + id + i + '" x1="0" x2="1"><stop offset="0" stop-color="' + c[1] + '"/><stop offset=".45" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs>' +
        '<rect class="liq" x="21" y="' + y.toFixed(1) + '" width="108" height="' + h.toFixed(1) + '" fill="url(#g' + id + i + ')"/>';
    });
    var surf = tot ? '<g clip-path="url(#cl' + id + ')"><path class="wv" d="M0 ' + y.toFixed(1) + ' q 12 -5 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 v 6 h -168 z" fill="rgba(255,255,255,.35)"/>' +
      '<circle class="bb" cx="55" cy="' + (top + H - 10) + '" r="3" fill="rgba(255,255,255,.7)"/><circle class="bb" style="animation-delay:.8s" cx="92" cy="' + (top + H - 20) + '" r="2.5" fill="rgba(255,255,255,.6)"/><circle class="bb" style="animation-delay:1.5s" cx="74" cy="' + (top + H - 5) + '" r="2" fill="rgba(255,255,255,.6)"/></g>' : '';
    return '<svg viewBox="0 0 150 220" aria-hidden="true"><defs><clipPath id="cl' + id + '"><rect x="21" y="' + top + '" width="108" height="' + H + '" rx="4"/></clipPath>' +
      '<linearGradient id="steel' + id + '" x1="0" x2="1"><stop offset="0" stop-color="#7d8c87"/><stop offset=".25" stop-color="#e9f0ed"/><stop offset=".55" stop-color="#b6c4bf"/><stop offset="1" stop-color="#5d6b66"/></linearGradient></defs>' +
      '<rect x="40" y="196" width="10" height="20" fill="#4a5752"/><rect x="100" y="196" width="10" height="20" fill="#4a5752"/>' +
      '<path d="M18 36 Q18 22 75 20 Q132 22 132 36 V194 Q132 204 75 206 Q18 204 18 194 Z" fill="url(#steel' + id + ')"/>' +
      '<rect x="21" y="' + top + '" width="108" height="' + H + '" rx="4" fill="rgba(8,30,24,.55)"/>' + '<g clip-path="url(#cl' + id + ')">' + layers + '</g>' + surf +
      '<rect x="21" y="' + top + '" width="108" height="' + H + '" rx="4" fill="none" stroke="rgba(255,255,255,.25)"/>' +
      '<rect x="26" y="' + top + '" width="10" height="' + H + '" fill="rgba(255,255,255,.18)"/>' +
      '<ellipse cx="75" cy="22" rx="57" ry="9" fill="#cfdad6"/><rect x="72" y="0" width="6" height="26" fill="#9aa8a3"/>' +
      '<g class="mixr"' + (tot ? '' : ' style="animation:none"') + '><rect x="73" y="26" width="4" height="70" fill="rgba(220,230,226,.6)"/></g>' +
      [0.25, 0.5, 0.75].map(function (f) { return '<line x1="122" x2="129" y1="' + (top + H * (1 - f)) + '" y2="' + (top + H * (1 - f)) + '" stroke="rgba(255,255,255,.5)"/>'; }).join('') + '</svg>';
  }
  function heroScene() {
    return ['SEC-1', 'SEC-2'].map(function (sec) {
      var t = S.rows[sec].reduce(function (s, r) { return s + (r.p && r.b > 0 ? r.b : 0); }, 0);
      return '<div class="tk">' + tankSvg(sec) + '<div class="lbl">' + SEC[sec] + '<b>' + t + ' batch' + (t === 1 ? '' : 'es') + '</b></div></div>';
    }).join('');
  }
  function rowHtml(sec, r, i) {
    var c = COL[r.p] || ['#cfd8d4', '#9aa'];
    return '<div class="prow"><span class="dot" style="background:radial-gradient(circle at 35% 30%,' + c[0] + ',' + c[1] + ')"></span>' +
      '<select data-s="' + sec + '" data-i="' + i + '" aria-label="Product"><option value="">Choose a product…</option>' + PRODS.map(function (p) { return '<option value="' + p + '"' + (p === r.p ? ' selected' : '') + '>' + PN[p] + '</option>'; }).join('') + '</select>' +
      (recList(r.p).length > 1 ? '<select class="rv" data-s="' + sec + '" data-i="' + i + '" aria-label="Recipe" style="width:auto">' + recList(r.p).map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === (r.v || '') ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select>' : '') +
      '<select class="zs" data-s="' + sec + '" data-i="' + i + '" aria-label="Size" style="width:auto">' + ((SIZES[r.p] || []).length ? SIZES[r.p].map(function (z) { return '<option' + (z === r.z ? ' selected' : '') + '>' + z + '</option>'; }).join('') : '<option value="">–</option>') + '</select>' +
      '<div class="step"><button type="button" data-d="-1" data-s="' + sec + '" data-i="' + i + '" aria-label="One batch less">−</button><input type="number" min="0" step="any" inputmode="decimal" value="' + (r.b || 0) + '" data-s="' + sec + '" data-i="' + i + '" aria-label="Batches"><button type="button" data-d="1" data-s="' + sec + '" data-i="' + i + '" aria-label="One batch more">+</button></div>' +
      '<button type="button" class="x" data-rm="' + i + '" data-s="' + sec + '" aria-label="Remove">×</button></div>';
  }
  function secHtml(sec) {
    var t = S.rows[sec].reduce(function (s, r) { return s + (r.p && r.b > 0 ? r.b : 0); }, 0);
    return '<div class="sec"><div class="top"><h2>' + SEC[sec] + '<span class="n">' + t + ' bt</span></h2></div>' +
      S.rows[sec].map(function (r, i) { return rowHtml(sec, r, i); }).join('') +
      '<button type="button" class="add" data-add="' + sec + '">+ Add a product</button></div>';
  }
  function matsHtml(list) {
    if (!list.length) return '<div class="empty3"><div class="ic">🧪</div><p>Choose a product and the number of batches above.<br>The raw materials to prepare show up here.</p></div>';
    return '<div class="mats">' + list.map(function (o, k) {
      var x = MATS[o.id], u = unitTxt(x, o.app), have = stockNow[o.id], cls = '', st = '', kg = inKg(x, o.app), pk = packsTxt(x, kg);
      if (have != null && !isNaN(have)) {
        var pct = have > 0 ? Math.min(100, o.app / have * 100) : 100;
        cls = o.app > have ? 'short' : pct > 70 ? 'tight' : '';
        st = '<div class="bar"><b style="width:' + Math.max(3, pct).toFixed(0) + '%"></b></div><div class="st">' + (o.app > have ? 'Not enough: about ' + fq(Math.max(0, have)) + ' ' + pl(x.unit, have) + ' left in stock' : 'Uses ' + Math.round(pct) + '% of the ≈ ' + fq(have) + ' ' + pl(x.unit, have) + ' in stock') + '</div>';
      }
      return '<div class="mc ' + cls + '" style="animation-delay:' + (k * 40) + 'ms"><div class="nm">' + esc(x.name) + '</div><div class="q">' + (kg != null ? fq(kg) + '<small>kg</small>' : fq(u.main) + '<small>' + esc(pl(u.mu, u.main)) + '</small>') + '</div>' +
        (splitPacks(x, kg) ? '<div class="alt" style="font-weight:600;color:var(--ink)">= ' + esc(splitPacks(x, kg).txt) + '</div>' : pk ? '<div class="alt">= ' + esc(pk) + '</div>' : u.alt != null ? '<div class="alt">≈ ' + fq(u.alt) + ' ' + esc(pl(u.au, u.alt)) + '</div>' : '') +
        '<div class="by">' + o.by.map(function (b) { var c = COL[b.p] || ['#aaa']; return '<span><i style="background:' + c[0] + '"></i>' + b.p + (b.z ? ' ' + b.z : '') + (b.v ? ' (' + esc((recList(b.p).filter(function (q) { return q.id === b.v; })[0] || {}).name || '') + ')' : '') + ' ' + (b.sec === 'SEC-1' ? 'S1' : 'S2') + ' · ' + b.b + ' bt → ' + (kg != null ? fq(inKg(x, b.app)) + ' kg' : fq(b.app * (x.recipeFactor || 1))) + '</span>'; }).join('') + '</div>' + st + '</div>';
    }).join('') + '</div>';
  }
  var SRC = { actual: 'Filled from the batches saved in the Line Planner (actuals).', plan: 'Filled from the Line Planner forecast for this day.', factory: 'Filled from the factory plan.', mine: 'Your numbers for this day (saved on this device).', '': 'Nothing planned in the Line Planner for this day yet. Add the products and batches.' };
  function render() {
    var list = need(), t = totals(), lot = A.lot(S.date);
    $('#main').innerHTML = '<div class="pp">' +
      '<section class="hero"><div class="hl"><span class="kick">Preparation · tanks</span><h1>What to prepare<br>' + (S.date === TODAY ? 'today' : 'on ' + new Date(S.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })) + '</h1>' +
      '<div class="datebar"><input type="date" id="d" value="' + S.date + '" aria-label="Day"><button type="button" id="today">Today</button><button type="button" id="lp" title="Take the batches from the Line Planner again">↻ From Line Planner</button></div>' +
      '<div class="ticket" title="Lot number: year + day of the year"><div class="t"><div class="a">LOT</div><div class="b"><small>Lot number</small><b>' + lot + '</b></div></div></div>' +
      '<div class="stats"><div><b>' + t.b + '</b>batches</div><div><b>' + t.p + '</b>product' + (t.p === 1 ? '' : 's') + '</div><div><b>' + list.length + '</b>raw materials</div></div></div>' +
      '<div class="scene" id="scene"><div class="floor" id="floor"><div class="pad"></div><div class="tanks">' + heroScene() + '</div></div></div></section>' +
      '<p class="src" style="margin:12px 4px 0">' + SRC[S.src || ''] + '</p>' +
      '<div class="grid2">' + secHtml('SEC-1') + secHtml('SEC-2') + '</div>' +
      ['SEC-1', 'SEC-2'].map(function (sc) {
        var L = need(sc), pr = S.rows[sc].filter(function (r) { return r.p && r.b > 0; });
        return '<div class="mhead"><div><h2>' + SEC[sc] + ' · raw materials to prepare</h2><p>' + (pr.length ? pr.map(function (r) { return r.p + (r.z ? ' ' + r.z : '') + ' × ' + r.b; }).join(' · ') : 'Nothing on this section') + ' · Lot ' + lot + '</p></div>' +
          (pr.length ? '<div class="exp"><button class="btn primary" data-print="' + sc + '" type="button">🖨 ' + SEC[sc] + ' sheet</button></div>' : '') + '</div>' + (pr.length ? matsHtml(L) : '');
      }).join('') +
      '<div class="mhead"><div><h2>Both sections</h2><p>Everything for the day, for the store</p></div><div class="exp"><button class="btn" id="xPrint" type="button">🖨 Both sections</button><button class="btn" id="xXls" type="button">⬇ Excel</button><button class="btn" id="xCopy" type="button">⧉ Copy</button></div></div>' +
      '<p class="note2">Amounts come from <a href="materials.html#recipes">Recipes per batch</a>; packs from the Inventory. "In stock" is the counted stock minus what the Line Planner batches used since the count.</p></div>';
    wire(); tilt();
  }
  function wire() {
    $('#d').onchange = function () { if (this.value) { S.date = this.value; load(); render(); } };
    $('#today').onclick = function () { S.date = TODAY; load(); render(); };
    $('#lp').onclick = function () { try { localStorage.removeItem(key()); } catch (e) {} var f = fromLP(S.date); S.rows = f.rows; S.src = f.src; fixSizes(); render(); toast(f.src ? 'Taken from the Line Planner' : 'Nothing in the Line Planner for this day'); };
    document.querySelectorAll('.prow select:not(.zs):not(.rv)').forEach(function (el) { el.onchange = function () { var r = S.rows[el.dataset.s][+el.dataset.i]; r.p = el.value; r.v = ''; r.z = (SIZES[r.p] || [''])[SIZES[r.p] && SIZES[r.p].length > 1 ? SIZES[r.p].length - 1 : 0]; S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('.prow select.rv').forEach(function (el) { el.onchange = function () { S.rows[el.dataset.s][+el.dataset.i].v = el.value; S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('.prow select.zs').forEach(function (el) { el.onchange = function () { S.rows[el.dataset.s][+el.dataset.i].z = el.value; S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('.step input').forEach(function (el) { el.onchange = function () { S.rows[el.dataset.s][+el.dataset.i].b = Math.max(0, Math.round((Number(el.value) || 0) * 1000) / 1000); S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('.step button').forEach(function (el) { el.onclick = function () { var r = S.rows[el.dataset.s][+el.dataset.i]; r.b = Math.max(0, (r.b || 0) + Number(el.dataset.d)); S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('[data-rm]').forEach(function (el) { el.onclick = function () { S.rows[el.dataset.s].splice(+el.dataset.rm, 1); S.src = 'mine'; store(); render(); }; });
    document.querySelectorAll('[data-add]').forEach(function (el) { el.onclick = function () { var used = S.rows[el.dataset.add].map(function (r) { return r.p; }); var np = PRODS.filter(function (p) { return used.indexOf(p) < 0; })[0] || ''; S.rows[el.dataset.add].push({ p: np, z: (SIZES[np] || [''])[(SIZES[np] || ['']).length - 1], b: 1 }); S.src = 'mine'; store(); render(); }; });
    $('#xPrint').onclick = function () { printSheet(null); }; $('#xXls').onclick = excel; $('#xCopy').onclick = copyTxt;
    document.querySelectorAll('[data-print]').forEach(function (b) { b.onclick = function () { printSheet(b.dataset.print); }; });
  }
  function tilt() {
    var sc = $('#scene'), fl = $('#floor'); if (!sc || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    sc.onmousemove = function (e) { var b = sc.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5; fl.style.setProperty('--ry', (x * 26 - 6) + 'deg'); fl.style.setProperty('--rx', (12 - y * 16) + 'deg'); };
    sc.onmouseleave = function () { fl.style.removeProperty('--ry'); fl.style.removeProperty('--rx'); };
    document.querySelectorAll('.mc').forEach(function (c) {
      c.onmousemove = function (e) { var b = c.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5; c.style.transform = 'rotateY(' + (x * 10) + 'deg) rotateX(' + (-y * 10) + 'deg) translateZ(6px)'; };
      c.onmouseleave = function () { c.style.transform = ''; };
    });
  }

  /* ---------- exports ---------- */
  function prodRows(only) { var o = []; ['SEC-1', 'SEC-2'].filter(function (s) { return !only || s === only; }).forEach(function (s) { S.rows[s].forEach(function (r) { if (r.p && r.b > 0) o.push({ sec: SEC[s], p: PN[r.p] + (r.v ? ' · ' + ((recList(r.p).filter(function (q) { return q.id === r.v; })[0] || {}).name || '') : ''), z: r.z || '', b: r.b }); }); }); return o; }
  function matRows(only) { return need(only).map(function (o) { var x = MATS[o.id], u = unitTxt(x, o.app), kg = inKg(x, o.app), sp = splitPacks(x, kg); return { sp: sp, name: x.name, q: kg != null ? kg : u.main, u: kg != null ? 'kg' : u.mu, packs: packsTxt(x, kg) || (u.alt != null ? fq(u.alt) + ' ' + pl(u.au, u.alt) : ''), by: o.by.map(function (b) { return b.p + (b.z ? ' ' + b.z : '') + ' ' + (b.sec === 'SEC-1' ? 'S1' : 'S2') + ' ' + fq(kg != null ? inKg(x, b.app) : b.app * (x.recipeFactor || 1)); }).join(' · ') }; }); }
  function printSheet(only) {
    var lot = A.lot(S.date), secs = only ? [only] : ['SEC-1', 'SEC-2'], html = '';
    if (!prodRows(only).length) { toast('Add at least one product first'); return; }
    secs.forEach(function (sc, n) {
      var pr = prodRows(sc), mr = matRows(sc); if (!pr.length) return;
      html += '<div class="pg"' + (html ? ' style="page-break-before:always"' : '') + '><div class="meta"><div><div style="font:600 11pt var(--f-mono);letter-spacing:.1em">ATIC OMAN · PREPARATION · ' + SEC[sc].toUpperCase() + '</div><h1>' + nice(S.date) + '</h1></div><div class="lotp">LOT ' + lot + '</div></div>' +
        '<h2>Products</h2><table class="big"><thead><tr><th>Product</th><th>Size</th><th class="n">Batches</th><th style="width:22%">Done ✓</th></tr></thead><tbody>' + pr.map(function (r) { return '<tr><td><b>' + esc(r.p) + '</b></td><td>' + esc(r.z) + '</td><td class="n"><b>' + r.b + '</b></td><td></td></tr>'; }).join('') + '</tbody></table>' +
        '<h2>Raw materials to weigh</h2><table class="big"><thead><tr><th>Material</th><th class="n">Bags / packs</th><th class="n">+ kg</th><th class="n">Total kg</th><th style="width:16%">Weighed ✓</th><th style="width:16%">By</th></tr></thead><tbody>' +
        mr.map(function (r) { var sp = r.sp; return '<tr><td><b>' + esc(r.name) + '</b><div class="sm">' + esc(r.by) + '</div></td><td class="n">' + (sp && sp.whole ? '<b>' + sp.whole + '</b> ' + esc(pl(sp.per, sp.whole)) + '<div class="sm">of ' + fq(sp.size) + ' kg</div>' : '–') + '</td><td class="n"><b>' + (sp ? fq(sp.loose) : '–') + '</b>' + (sp ? ' kg' : '') + '</td><td class="n">' + fq(r.q) + ' ' + esc(pl(r.u, r.q)) + '</td><td></td><td></td></tr>'; }).join('') + '</tbody></table>' +
        '<div class="sign"><div>Prepared by</div><div>Checked by</div><div>Time</div></div></div>';
    });
    $('#sheet').innerHTML = html;
    var t0 = document.title; document.title = 'Preparation ' + S.date + ' lot ' + lot + (only ? ' ' + SEC[only] : ''); window.print(); setTimeout(function () { document.title = t0; }, 1500);
  }
  function excel() {
    var lot = A.lot(S.date); if (!prodRows().length) { toast('Add at least one product first'); return; }
    var sheets = ['SEC-1', 'SEC-2'].filter(function (sc) { return prodRows(sc).length; }).map(function (sc) {
      var pr = prodRows(sc), mr = matRows(sc);
      return { name: SEC[sc], aoa: [['ATIC Oman · Preparation · ' + SEC[sc]], ['Date', S.date], ['Lot', lot], [], ['Product', 'Size', 'Batches']].concat(pr.map(function (r) { return [r.p, r.z, r.b]; }))
        .concat([[], ['Raw material', 'Bags / packs', 'Pack', '+ kg', 'Total kg', 'For']]).concat(mr.map(function (r) { var sp = r.sp; return [r.name, sp ? sp.whole : '', sp ? sp.per + ' of ' + sp.size + ' kg' : '', sp ? sp.loose : '', Math.round(r.q * 1000) / 1000, r.by]; })) };
    });
    if (window.XLSX) { var wb = XLSX.utils.book_new(); sheets.forEach(function (sh) { var ws = XLSX.utils.aoa_to_sheet(sh.aoa); ws['!cols'] = [{ wch: 26 }, { wch: 14 }, { wch: 16 }, { wch: 10 }, { wch: 12 }, { wch: 40 }]; XLSX.utils.book_append_sheet(wb, ws, sh.name); }); XLSX.writeFile(wb, 'Preparation ' + S.date + ' lot ' + lot + '.xlsx'); }
    else A.download('Preparation ' + S.date + ' lot ' + lot + '.csv', sheets.map(function (sh) { return sh.aoa.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n'); }).join('\n\n'));
  }
  function copyTxt() {
    if (!prodRows().length) { toast('Add at least one product first'); return; }
    var t = 'Preparation ' + nice(S.date) + ' · Lot ' + A.lot(S.date);
    ['SEC-1', 'SEC-2'].forEach(function (sc) { var pr = prodRows(sc); if (!pr.length) return; t += '\n\n*' + SEC[sc] + '*: ' + pr.map(function (r) { return r.p + (r.z ? ' ' + r.z : '') + ' × ' + r.b; }).join(', ') + '\n' + matRows(sc).map(function (r) { return '• ' + r.name + ': ' + (r.sp ? r.sp.txt + ' (= ' + fq(r.q) + ' kg)' : fq(r.q) + ' ' + pl(r.u, r.q)); }).join('\n'); });
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Copied: paste it in WhatsApp or anywhere'); }, function () { toast('Could not copy'); });
  }

  load(); render();
})();
