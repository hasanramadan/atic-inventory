<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATIC Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css?v=202611080947">
<style>.soon-x{max-width:720px;margin:6vh auto 0;text-align:center}.soon .ic{font-size:56px}.soon h1{font-size:30px;margin:10px 0 8px}.soon .tag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--gold);color:#1b1306}.soon ul{text-align:left;max-width:520px;margin:18px auto;line-height:1.7}</style>
</head><body>
<div class="app"><aside class="rail" id="rail"></aside>
<main id="main"><div class="boot"><div><i></i>Loading…</div></div></main></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=202611080947"></script>
<script src="js/shell.js?v=202611080947"></script>
<script src="js/backup.js?v=202611080947" defer></script>
<script src="js/assistant.js?v=202611080947" defer></script>
<script>
(async function () {
  var A = await ATIC.boot({ page: 'lab', area: 'lab' }); if (!A) return;
  var m = document.getElementById('main'); m.style.padding = '0';
  m.innerHTML = '<iframe id="labFrame" src="lab-app.html?v=' + (document.currentScript ? '' : '') + Date.now().toString(36) + '" title="ATIC Lab" style="display:block;width:100%;height:100vh;border:0;background:transparent"></iframe>';
  /* phones: the website menu sits on top, so the lab gets the rest of the height */
  function fit() { var f = document.getElementById('labFrame'); if (f) f.style.height = (window.innerHeight - f.getBoundingClientRect().top) + 'px'; }
  window.addEventListener('resize', fit); setTimeout(fit, 50); setTimeout(fit, 600);
})();
</script>
</body></html>
