<style>
.wrap{display:flex;flex-direction:column;gap:18px;max-width:1150px}
.top h1{margin:0}.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card>.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card>.ch h2{font-size:19px;margin:0}.tag{font-size:12px;color:var(--muted)}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.sec .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec .p{font:600 16px var(--f-display)}

.sec .s{font-size:13px;color:var(--muted)}

.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono)}
.fc{color:var(--muted)}.rl{font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.eq{color:var(--muted)}
.stops{font-size:13px;color:var(--muted);margin:6px 0 14px}
.sname{font:600 14px var(--f-display);margin:4px 0 2px}
.pill{display:inline-block;padding:2px 9px;border-radius:8px;font-size:12.5px;font-weight:600}
.pill.r{background:var(--red-soft);color:var(--red)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.g{background:var(--green-soft);color:var(--green)}
.more{font-size:13px;color:var(--muted);margin-top:10px}.more a{color:var(--brand);font-weight:600}
.empty{color:var(--muted);font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.mc.r{border-left:4px solid var(--red)}.mc.a{border-left:4px solid var(--amber)}.mc.g{border-left:4px solid var(--green)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh b{font:600 16px var(--f-display)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow>div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:92px;flex:1}
.flow>div span{font-size:11.5px;color:var(--muted)}.flow>div b{font:600 19px var(--f-mono)}.flow>div small{font-size:11.5px;color:var(--muted)}
.flow>div.now{background:var(--brand);color:var(--brand-ink)}.flow>div.now span,.flow>div.now small{color:inherit;opacity:.8}
.flow i{font-style:normal;color:var(--muted);font-weight:600}
.dv{display:block;padding:3px 8px;border-radius:8px;margin:2px 0;font-size:12.5px}.dv.ok{background:var(--green-soft);color:var(--green)}.dv.late{background:var(--red-soft);color:var(--red);font-weight:600}.dv.wait{background:var(--surface-2)}
.mf{display:flex;flex-direction:column;gap:3px;font-size:13px}.mf small{color:var(--muted)}.muted{color:var(--muted)}
details.allm,details.how{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.allm summary,details.how summary{cursor:pointer;font-weight:600;color:var(--brand)}
details.how ol{font-size:13.5px;padding-left:20px;display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
details.allm .mgrid{margin-top:12px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}}
@media (max-width:860px){.secs{grid-template-columns:1fr}.tbl{font-size:13.5px}}
</style>

<script>

function materials() {

  var cut = D.lpDays[TODAY] ? TODAY : SP.util.addDays(TODAY, -1), evs = ME.orderEvents ? ME.orderEvents((D.docs.orders && D.docs.orders.items) || []) : [];

    var rec = 0; evs.forEach(function (o) { if (o.material === r.id && o.received && o.eta > st.asOf && o.eta <= cut) rec += Number(o.qty) || 0; });

  function nums(r) {
    var st = fc.model && fc.model.stock && fc.model.stock[r.id]; if (!st || st.qty == null || !st.asOf) return null;

    (r.daily || []).forEach(function (x) { if (x.date > st.asOf && x.date <= cut && (!ws || x.date >= ws)) used += x.use; });
    var rec = 0; evs.forEach(function (o) { if (o.material === r.id && o.received && o.eta > st.asOf && o.eta <= cut) rec += Number(o.qty) || 0; });

  var dBatches = (dcd && dcd.batches) || (lastDay && D.lpDays[lastDay]) || {}, dAdj = (dcd && dcd.adj) || {};

function render() {

(async function () {
